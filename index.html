<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzards</title>
<meta name="description" content="A wizard-themed trivia board game for four houses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--accent:#E2B857;--bg:#14182B;--card:#1E2440;--line:#2E3558;--line2:#3A4266;--chip:#2A3156;--text:#F3EFE6;--muted:#A9AEC4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
#app{max-width:1200px;margin:0 auto;padding:36px 24px 56px;display:flex;flex-direction:column;gap:28px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
h1{margin:0;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:44px;line-height:1.1;color:var(--accent)}
.scores{display:flex;flex-wrap:wrap;align-items:stretch;gap:12px}
.score,.wager{display:flex;flex-direction:column;gap:4px;min-width:132px;padding:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bar{height:5px}
.score-name{padding:6px 18px 0;font-size:13px;font-weight:600;color:var(--muted)}
.score-num{padding:0 18px;font-size:30px;font-weight:700}
.btn{min-height:48px;padding:0 22px;border-radius:12px;font-size:16px;font-weight:600;border:1px solid var(--line2);background:var(--chip);color:var(--text)}
.btn.ghost{background:transparent;color:var(--muted);min-height:44px;font-size:14px;align-self:center}
.btn.gold{background:var(--accent);color:var(--bg);border:none;font-weight:700}
.btn.big{min-height:52px;padding:0 28px;font-size:17px;align-self:flex-start}
.btn.center{align-self:center}
.btn.right{align-self:flex-end}
.btn:focus-visible,.tile:focus-visible,.back:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.muted{color:var(--muted);margin:0;font-size:16px}
.small{font-size:14px}
.lead{font-size:17px;line-height:1.5}
.board-intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px}
.board-scroll{overflow-x:auto;padding-bottom:4px}
.board{min-width:760px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.head{display:flex;align-items:center;justify-content:center;min-height:64px;padding:8px 10px;background:#232A4A;border-radius:12px;text-align:center;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:17px;line-height:1.2;color:var(--accent)}
.tile{min-height:48px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:22px;font-weight:700}
.tile:hover{border-color:var(--accent)}
.tile.used{background:#171B30;border:1px dashed var(--line)}
.cleared{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:28px 32px;background:var(--card);border:2px solid var(--accent);border-radius:20px}
.cleared>div{display:flex;flex-direction:column;gap:6px}
.cleared-text{font-size:24px;font-weight:600}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.accent{color:var(--accent)}
.narrow{display:flex;flex-direction:column;gap:20px;width:100%;max-width:900px;margin:0 auto}
.narrow.wide{max-width:960px}
.back{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;background:transparent;color:var(--muted);border:none;font-size:15px;font-weight:600}
.card{display:flex;flex-direction:column;gap:28px;padding:44px;background:var(--card);border:1px solid var(--line);border-radius:22px}
.card.final{border:2px solid var(--accent)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.meta-right{display:flex;align-items:center;gap:12px}
.chip{padding:6px 14px;background:var(--chip);border-radius:999px;font-size:14px;font-weight:600}
.dots{display:flex;gap:4px}
.dot{width:8px;height:16px;border-radius:3px}
.pts{font-size:18px;font-weight:700;color:var(--accent)}
.question{margin:0;font-size:34px;font-weight:600;line-height:1.3}
.answer{display:flex;flex-direction:column;gap:6px;padding:20px 24px;background:var(--bg);border:1px solid var(--accent);border-radius:16px}
.answer-text{font-size:28px;font-weight:700;color:var(--accent)}
.label{font-size:15px;font-weight:600;color:var(--muted)}
.btn.house{display:flex;align-items:center;gap:10px}
.pip{width:12px;height:12px;border-radius:6px;display:inline-block;flex:none}
.big-pip{width:14px;height:14px;border-radius:7px}
.final-title{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:30px;color:var(--accent)}
.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.wager{background:var(--bg);gap:8px;padding-bottom:18px}
.wager-name{padding:6px 18px 0;font-size:18px;font-weight:700}
.pad{padding:0 18px}
.wager .label{padding-top:6px;font-size:13px}
.wager input{margin:0 18px;min-height:48px;padding:0 14px;background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:20px;font-weight:700}
.judge-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.row-left{display:flex;align-items:center;gap:12px;font-size:18px}
.btn.judge{min-height:44px;font-size:15px}
.btn.right-on{background:#2F7D4F}
.btn.wrong-on{background:#B23A35}
.winner{display:flex;flex-direction:column;gap:8px;text-align:center;padding:12px 0}
.winner-text{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:40px;line-height:1.2;color:var(--accent)}
.rank{display:flex;align-items:center;gap:16px;padding:16px 22px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.place{width:36px;font-size:22px;font-weight:700;color:var(--muted)}
.rank-name{flex:1 1 auto;font-size:20px;font-weight:700}
.rank-score{min-width:56px;text-align:right;font-size:28px;font-weight:700}
.header-btns{display:flex;gap:8px;align-self:center}
.score.is-turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.btn.left{align-self:flex-start}
.name-row{display:flex;gap:10px;flex-wrap:wrap}
.name-row input{flex:1 1 240px;min-height:48px;padding:0 14px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:17px}
.name-row input::placeholder{color:#8A90A8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.name-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 14px;background:var(--chip);border-radius:999px;font-size:15px;font-weight:600}
.chip-x{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;background:transparent;border:none;color:var(--muted)}
.chip-x:hover{color:var(--text);background:#343B5E}
.hat-card{align-items:center;text-align:center;padding:56px 32px}
.hat-name{font-size:40px;font-weight:700}
.hat-thinking{font-size:24px;font-style:italic;color:var(--muted);min-height:64px;display:flex;align-items:center;animation:pulse 1s ease-in-out infinite alternate}
.hat-house{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:56px;min-height:64px;letter-spacing:.04em;animation:pop .35s ease-out}
.center-row{justify-content:center}
.rosters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.roster{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.roster-name{padding:12px 18px 4px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:22px}
.roster ul{margin:0;padding:4px 18px 18px 36px;display:flex;flex-direction:column;gap:4px;font-size:17px}
.turn-banner{display:flex;align-items:center;gap:14px;padding:16px 22px;background:var(--card);border:2px solid;border-radius:16px}
.turn-text{display:flex;flex-direction:column;gap:2px}
.turn-name{font-size:22px;font-weight:700}
.btn.picker{border-color:var(--accent)}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hat-thinking,.hat-house{animation:none}}
@media (max-width:640px){h1{font-size:34px}.card{padding:24px}.question{font-size:26px}.winner-text{font-size:30px}.hat-house{font-size:40px}.hat-name{font-size:30px}.rank{flex-wrap:wrap}}
</style>
</head>
<body>
<main id="app"></main>

     ["When Slughorn shows the class Amortentia, what does Hermione say she smells?", "Freshly mown grass and new parchment (then she stops herself)"],
     ["Name any three ingredients in Polyjuice Potion.", "Any three of: lacewing flies, leeches, fluxweed, knotgrass, bicorn horn, boomslang skin"]]
  ]}
];

var FINALS = [
  { cat: "The Deathly Hallows", q: "In the tale of the three brothers, the Deathly Hallows first belonged to the Peverell brothers. What were the three brothers' first names?", a: "Antioch, Cadmus and Ignotus Peverell" },
  { cat: "Horcruxes", q: "Name all six Horcruxes that Voldemort made on purpose.", a: "Tom Riddle's diary, Marvolo Gaunt's ring, Slytherin's locket, Hufflepuff's cup, Ravenclaw's diadem and Nagini" },
  { cat: "Wandlore", q: "What wood and what core is Voldemort's original wand made of?", a: "Yew, with a phoenix feather core" },
  { cat: "Godric's Hollow", q: "What words are carved on James and Lily Potter's gravestone?", a: "\"The last enemy that shall be destroyed is death\"" },
  { cat: "The Mirror of Erised", q: "When Harry asks what Dumbledore sees in the Mirror of Erised, what does Dumbledore say he sees?", a: "Himself holding a pair of thick, woollen socks" }
];

var HOUSES = [
  { name: "Gryffindor", color: "#D6453D" },
  { name: "Hufflepuff", color: "#ECB939" },
  { name: "Ravenclaw", color: "#6E93E0" },
  { name: "Slytherin", color: "#4FA36A" }
];

var SEEN_KEY = "quizzards-seen-v1";
function loadSeen() {
  try { return JSON.parse(window.localStorage.getItem(SEEN_KEY) || "{}") || {}; } catch (e) { return {}; }
}
function saveSeen(seen) {
  try { window.localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
}
// Pick a random index from a pool of n, preferring ones not seen yet.
// When every question in the pool has been seen, that pool starts over.
function pickUnseen(n, prefix, seen) {
  var open = [];
  for (var i = 0; i < n; i++) if (!seen[prefix + i]) open.push(i);
  if (open.length === 0) {
    for (var k = 0; k < n; k++) delete seen[prefix + k];
    for (var j = 0; j < n; j++) open.push(j);
  }
  return open[Math.floor(Math.random() * open.length)];
}

var TOTAL_QUESTIONS = CATS.reduce(function (sum, c) {
  return sum + c.qs.reduce(function (s2, pool) { return s2 + pool.length; }, 0);
}, 0);


// ---------- Players and houses ----------
var PLAYERS_KEY = "quizzards-players-v1";
function loadPlayers() {
  try { var p = JSON.parse(window.localStorage.getItem(PLAYERS_KEY) || "[]"); return Array.isArray(p) ? p : []; } catch (e) { return []; }
}
function savePlayers(p) {
  try { window.localStorage.setItem(PLAYERS_KEY, JSON.stringify(p)); } catch (e) {}
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// Teams live outside the game state so "New game" keeps everyone in their houses.
var teams = { players: loadPlayers(), sorted: null, active: [0, 1, 2, 3] };

function membersOf(h) {
  if (!teams.sorted) return [];
  return teams.sorted.filter(function (p) { return p.house === h; }).map(function (p) { return p.name; });
}

// ---------- Game state ----------
var state;
var lastView = "";
var hatTimer = null;

function fresh() {
  var seen = loadSeen();
  var deal = CATS.map(function (c, ci) {
    return c.qs.map(function (pool, li) { return pickUnseen(pool.length, ci + "-" + li + "-", seen); });
  });
  var finalIdx = pickUnseen(FINALS.length, "F-", seen);
  saveSeen(seen);
  return {
    screen: "board", setupStep: "names", revealIdx: 0, thinking: false,
    cat: 0, v: 1, revealed: false,
    turn: Math.floor(Math.random() * teams.active.length),
    scores: [0, 0, 0, 0], used: {}, deal: deal, finalIdx: finalIdx,
    finalStep: "wager", wagers: ["", "", "", ""], judged: [null, null, null, null], before: [0, 0, 0, 0]
  };
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function markSeen(key) {
  var seen = loadSeen();
  seen[key] = true;
  saveSeen(seen);
}

function maxWager(i) { return Math.max(state.scores[i], 10); }
function turnHouse() { return teams.active[state.turn % teams.active.length]; }

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function usedCount() { return Object.keys(state.used).length; }

function hatThink() {
  clearTimeout(hatTimer);
  setState({ thinking: true });
  hatTimer = setTimeout(function () { setState({ thinking: false }); }, 1400);
}

function addNameFromInput() {
  var input = document.getElementById("name-input");
  if (!input) return;
  var names = input.value.split(",").map(function (n) { return n.trim().slice(0, 40); }).filter(Boolean);
  if (!names.length) return;
  teams.players = teams.players.concat(names);
  savePlayers(teams.players);
  render();
  var again = document.getElementById("name-input");
  if (again) again.focus();
}

// ---------- Actions ----------
var actions = {
  addName: function () { addNameFromInput(); },
  removeName: function (el) {
    teams.players.splice(+el.dataset.i, 1);
    savePlayers(teams.players);
    render();
  },
  clearNames: function () { teams.players = []; savePlayers(teams.players); render(); },
  sortPlayers: function () {
    if (!teams.players.length) return;
    var names = shuffle(teams.players);
    var order = shuffle([0, 1, 2, 3]);
    teams.sorted = names.map(function (n, i) { return { name: n, house: order[i % 4] }; });
    teams.active = [0, 1, 2, 3].filter(function (h) { return membersOf(h).length > 0; });
    setState({ setupStep: "reveal", revealIdx: 0 });
    hatThink();
  },
  nextReveal: function () {
    if (state.revealIdx < teams.sorted.length - 1) {
      setState({ revealIdx: state.revealIdx + 1 });
      hatThink();
    } else {
      setState({ setupStep: "rosters", thinking: false });
    }
  },
  skipReveal: function () { clearTimeout(hatTimer); setState({ setupStep: "rosters", thinking: false }); },
  skipSorting: function () {
    teams.sorted = null;
    teams.active = [0, 1, 2, 3];
    state = fresh();
    render();
  },
  startGame: function () { state = fresh(); render(); },
  players: function () { setState({ screen: "setup", setupStep: "names" }); },
  reset: function () { state = fresh(); render(); },
  pick: function (el) { setState({ screen: "question", cat: +el.dataset.cat, v: +el.dataset.v, revealed: false }); },
  reveal: function () { setState({ revealed: true }); },
  back: function () { setState({ screen: "board", revealed: false }); },
  award: function (el) {
    var team = +el.dataset.team;
    var scores = state.scores.slice();
    if (team >= 0) scores[team] += state.v;
    var used = Object.assign({}, state.used);
    used[state.cat + "-" + state.v] = true;
    markSeen(state.cat + "-" + (state.v - 1) + "-" + state.deal[state.cat][state.v - 1]);
    setState({ scores: scores, used: used, screen: "board", revealed: false, turn: (state.turn + 1) % teams.active.length });
  },
  startFinal: function () { setState({ screen: "final", finalStep: "wager", wagers: ["", "", "", ""], judged: [null, null, null, null] }); },
  lockWagers: function () {
    var w = state.wagers.map(function (raw, i) {
      var n = parseInt(raw, 10);
      if (isNaN(n)) n = 0;
      return String(Math.min(Math.max(n, 0), maxWager(i)));
    });
    setState({ wagers: w, finalStep: "question" });
  },
  revealFinal: function () { markSeen("F-" + state.finalIdx); setState({ finalStep: "judge" }); },
  judge: function (el) {
    var a = state.judged.slice();
    a[+el.dataset.house] = el.dataset.right === "1";
    setState({ judged: a });
  },
  finishFinal: function () {
    var next = state.scores.map(function (sc, i) {
      if (teams.active.indexOf(i) < 0) return sc;
      var w = parseInt(state.wagers[i], 10) || 0;
      return state.judged[i] ? sc + w : sc - w;
    });
    setState({ before: state.scores.slice(), scores: next, finalStep: "results" });
  }
};

// ---------- Views ----------
function viewHeader() {
  var playing = state.screen !== "setup";
  var cards = playing ? teams.active.map(function (i) {
    var h = HOUSES[i];
    var isTurn = state.screen === "board" && i === turnHouse();
    return '<div class="score' + (isTurn ? ' is-turn' : '') + '"><span class="bar" style="background:' + h.color + '"></span>' +
      '<span class="score-name">' + h.name + '</span><span class="score-num">' + state.scores[i] + '</span></div>';
  }).join("") : "";
  var buttons = playing
    ? '<div class="header-btns"><button class="btn ghost" data-action="players">Players</button><button class="btn ghost" data-action="reset">New game</button></div>'
    : "";
  return '<header class="top"><h1>Quizzards</h1><div class="scores">' + cards + buttons + '</div></header>';
}

function viewSetup() {
  if (state.setupStep === "names") {
    var chips = teams.players.map(function (n, i) {
      return '<span class="name-chip">' + esc(n) + '<button class="chip-x" data-action="removeName" data-i="' + i + '" aria-label="Remove ' + esc(n) + '">' +
        '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>';
    }).join("");
    var count = teams.players.length;
    return '<section class="narrow"><div class="card">' +
      '<div class="stack-sm"><span class="final-title">The Sorting Ceremony</span>' +
      '<p class="muted lead">Add every player, then let the Sorting Hat put everyone into a house. Houses are kept as even as possible. With fewer than four players, only the houses that get someone will play.</p></div>' +
      '<div class="stack-sm"><label class="label" for="name-input">Player name</label>' +
      '<div class="name-row"><input id="name-input" type="text" maxlength="200" autocomplete="off" placeholder="Type a name and press Enter">' +
      '<button class="btn" data-action="addName">Add</button></div>' +
      '<span class="muted small">Tip: paste several names at once, separated by commas.</span></div>' +
      (count ? '<div class="stack-sm"><span class="label">' + count + (count === 1 ? ' player' : ' players') + '</span><div class="chips">' + chips + '</div>' +
        '<button class="btn ghost left" data-action="clearNames">Clear all</button></div>' : '') +
      '<div class="row">' +
      (count ? '<button class="btn gold big" data-action="sortPlayers">Sort everyone</button>' : '') +
      '<button class="btn ghost" data-action="skipSorting">Skip, we already have teams</button></div>' +
      '</div></section>';
  }
  if (state.setupStep === "reveal") {
    var p = teams.sorted[state.revealIdx];
    var total = teams.sorted.length;
    var last = state.revealIdx === total - 1;
    var result = state.thinking
      ? '<span class="hat-thinking">Hmm, difficult. Very difficult…</span>'
      : '<span class="hat-house" style="color:' + HOUSES[p.house].color + '">' + HOUSES[p.house].name.toUpperCase() + '!</span>';
    return '<section class="narrow"><div class="card hat-card">' +
      '<span class="eyebrow">Player ' + (state.revealIdx + 1) + ' of ' + total + '</span>' +
      '<span class="hat-name">' + esc(p.name) + '</span>' + result +
      '<div class="row center-row">' +
      (state.thinking ? '' : '<button class="btn gold big" data-action="nextReveal">' + (last ? 'See the houses' : 'Next player') + '</button>') +
      '<button class="btn ghost" data-action="skipReveal">Skip to the results</button></div>' +
      '</div></section>';
  }
  var cols = teams.active.map(function (h) {
    var names = membersOf(h).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join("");
    return '<div class="roster"><span class="bar" style="background:' + HOUSES[h].color + '"></span>' +
      '<span class="roster-name">' + HOUSES[h].name + '</span><ul>' + names + '</ul></div>';
  }).join("");
  return '<section class="stack"><div class="stack-sm"><span class="final-title">Your houses</span>' +
    '<p class="muted">Sit with your house. Each house takes turns picking from the board.</p></div>' +
    '<div class="rosters">' + cols + '</div>' +
    '<div class="row"><button class="btn gold big" data-action="startGame">Start the game</button>' +
    '<button class="btn ghost" data-action="sortPlayers">Sort again</button>' +
    '<button class="btn ghost" data-action="players">Edit players</button></div></section>';
}

function viewTurnBanner() {
  var h = turnHouse();
  var members = membersOf(h);
  return '<div class="turn-banner" style="border-color:' + HOUSES[h].color + '"><span class="pip big-pip" style="background:' + HOUSES[h].color + '"></span>' +
    '<div class="turn-text"><span class="turn-name">' + HOUSES[h].name + '’s turn to pick</span>' +
    (members.length ? '<span class="muted small">' + members.map(esc).join(", ") + '</span>' : '') +
    '</div></div>';
}

function viewBoard() {
  var heads = CATS.map(function (c) { return '<div class="head">' + esc(c.name) + '</div>'; }).join("");
  var tiles = "";
  for (var v = 1; v <= 10; v++) {
    for (var ci = 0; ci < CATS.length; ci++) {
      if (state.used[ci + "-" + v]) {
        tiles += '<div class="tile used" aria-hidden="true"></div>';
      } else {
        tiles += '<button class="tile" data-action="pick" data-cat="' + ci + '" data-v="' + v + '" aria-label="' +
          esc(CATS[ci].name) + ' for ' + v + (v === 1 ? ' point' : ' points') + '">' + v + '</button>';
      }
    }
  }
  var done = usedCount() === CATS.length * 10;
  var finalBlock = done
    ? '<div class="cleared"><div><span class="eyebrow accent">Board cleared</span><span class="cleared-text">Time for the final question.</span></div>' +
      '<button class="btn gold" data-action="startFinal">Go to the final question</button></div>'
    : '<button class="btn ghost right" data-action="startFinal">Skip to the final question</button>';
  return '<section class="stack">' + (done ? '' : viewTurnBanner()) +
    '<div class="board-scroll"><div class="board">' + heads + tiles + '</div></div>' + finalBlock + '</section>';
}

function viewQuestion() {
  var c = CATS[state.cat];
  var pair = c.qs[state.v - 1][state.deal[state.cat][state.v - 1]];
  var th = turnHouse();
  var dots = "";
  for (var d = 1; d <= 10; d++) dots += '<span class="dot" style="background:' + (d <= state.v ? "var(--accent)" : "#3A4266") + '"></span>';
  var body;
  if (!state.revealed) {
    var stealNote = teams.active.length > 1
      ? ' Think they’re wrong? Raise your hand to steal, and give your answer before the reveal.'
      : '';
    body = '<p class="muted lead"><strong class="turn-inline" style="color:' + HOUSES[th].color + '">' + HOUSES[th].name + '</strong> answers first.' + stealNote + '</p>' +
      '<button class="btn gold big" data-action="reveal">Reveal answer</button>';
  } else {
    var order = [th].concat(teams.active.filter(function (h) { return h !== th; }));
    var houseBtns = order.map(function (i) {
      var h = HOUSES[i];
      var label = i === th ? h.name + ' +' + state.v : h.name + ' steals +' + state.v;
      return '<button class="btn house' + (i === th ? ' picker' : '') + '" data-action="award" data-team="' + i + '"><span class="pip" style="background:' + h.color + '"></span>' +
        label + '</button>';
    }).join("");
    body = '<div class="answer"><span class="eyebrow">Answer</span><span class="answer-text">' + esc(pair[1]) + '</span></div>' +
      '<div class="stack-sm"><span class="label">Who got it?</span><div class="row">' + houseBtns +
      '<button class="btn ghost" data-action="award" data-team="-1">No one</button></div></div>';
  }
  return '<section class="narrow"><button class="back" data-action="back">' +
    '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back to the board</button>' +
    '<div class="card"><div class="meta"><span class="chip">' + esc(c.name) + '</span><div class="meta-right"><span class="muted small">Difficulty</span>' +
    '<span class="dots">' + dots + '</span><span class="pts">' + state.v + (state.v === 1 ? ' point' : ' points') + '</span></div></div>' +
    '<p class="question">' + esc(pair[0]) + '</p>' + body + '</div></section>';
}

function viewFinal() {
  var fq = FINALS[state.finalIdx];
  var act = teams.active;
  var inner = "";
  if (state.finalStep === "wager") {
    var cards = act.map(function (i) {
      var h = HOUSES[i];
      return '<div class="wager"><span class="bar" style="background:' + h.color + '"></span>' +
        '<span class="wager-name">' + h.name + '</span><span class="muted small pad">Score ' + state.scores[i] + ' · max wager ' + maxWager(i) + '</span>' +
        '<label class="label pad" for="wager-' + i + '">Wager</label>' +
        '<input id="wager-' + i + '" data-wager="' + i + '" type="number" min="0" max="' + maxWager(i) + '" inputmode="numeric" value="' + esc(state.wagers[i]) + '"></div>';
    }).join("");
    inner = '<p class="muted lead">Each house secretly writes down a wager, from 0 up to its current score. A house with fewer than 10 points can wager up to 10. Enter the wagers, then show the question. A right answer adds the wager, and a wrong one takes it away.</p>' +
      '<div class="wagers">' + cards + '</div><button class="btn gold big" data-action="lockWagers">Lock wagers and show the question</button>';
  } else if (state.finalStep === "question") {
    inner = '<p class="question">' + esc(fq.q) + '</p><p class="muted">Each house has 30 seconds to write down its answer.</p>' +
      '<button class="btn gold big" data-action="revealFinal">Reveal answer</button>';
  } else if (state.finalStep === "judge") {
    var rows = act.map(function (i) {
      var h = HOUSES[i];
      var j = state.judged[i];
      var w = parseInt(state.wagers[i], 10) || 0;
      return '<div class="judge-row"><div class="row-left"><span class="pip" style="background:' + h.color + '"></span><strong>' + h.name + '</strong>' +
        '<span class="muted">wagered ' + w + '</span></div><div class="row">' +
        '<button class="btn judge' + (j === true ? ' right-on' : '') + '" aria-pressed="' + (j === true) + '" data-action="judge" data-house="' + i + '" data-right="1">Right +' + w + '</button>' +
        '<button class="btn judge' + (j === false ? ' wrong-on' : '') + '" aria-pressed="' + (j === false) + '" data-action="judge" data-house="' + i + '" data-right="0">Wrong −' + w + '</button></div></div>';
    }).join("");
    var all = act.every(function (i) { return state.judged[i] !== null; });
    inner = '<p class="question">' + esc(fq.q) + '</p>' +
      '<div class="answer"><span class="eyebrow">Answer</span><span class="answer-text">' + esc(fq.a) + '</span></div>' +
      '<span class="label">Mark each house right or wrong</span><div class="stack-sm">' + rows + '</div>' +
      (all ? '<button class="btn gold big" data-action="finishFinal">Crown the House Cup winner</button>'
           : '<span class="muted">Mark every house to see the winner.</span>');
  } else {
    var idx = act.slice().sort(function (a, b) { return state.scores[b] - state.scores[a]; });
    var places = ["1st", "2nd", "3rd", "4th"];
    var rank = idx.map(function (i, k) {
      var dd = state.scores[i] - state.before[i];
      var delta = dd > 0 ? "+" + dd : dd < 0 ? "−" + Math.abs(dd) : "±0";
      return '<div class="rank"><span class="place">' + places[k] + '</span><span class="pip big-pip" style="background:' + HOUSES[i].color + '"></span>' +
        '<span class="rank-name">' + HOUSES[i].name + '</span><span class="muted">final question ' + delta + '</span><span class="rank-score">' + state.scores[i] + '</span></div>';
    }).join("");
    var top = Math.max.apply(null, act.map(function (i) { return state.scores[i]; }));
    var names = act.filter(function (i) { return state.scores[i] === top; }).map(function (i) { return HOUSES[i].name; });
    var winner = names.length === 1 ? names[0] + " wins the House Cup!"
      : names.length === act.length && act.length > 2 ? "Everyone ties!"
      : "It's a tie: " + names.slice(0, -1).join(", ") + " and " + names[names.length - 1] + "!";
    inner = '<div class="winner"><span class="eyebrow">The House Cup</span><span class="winner-text">' + esc(winner) + '</span></div>' +
      '<div class="stack-sm">' + rank + '</div><button class="btn gold big center" data-action="reset">Play again</button>';
  }
  return '<section class="narrow wide"><div class="card final"><div class="meta"><span class="final-title">Final Question</span>' +
    '<span class="chip">Category: ' + esc(fq.cat) + '</span></div>' + inner + '</div></section>';
}

function render() {
  var main = state.screen === "setup" ? viewSetup()
    : state.screen === "board" ? viewBoard()
    : state.screen === "question" ? viewQuestion()
    : viewFinal();
  document.getElementById("app").innerHTML = viewHeader() + main;
  var key = state.screen + "/" + state.finalStep + "/" + state.setupStep;
  if (key !== lastView) window.scrollTo(0, 0);
  lastView = key;
}

// ---------- Wiring ----------
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el);
});
document.addEventListener("input", function (e) {
  var i = e.target.dataset && e.target.dataset.wager;
  if (i !== undefined) state.wagers[+i] = e.target.value; // no re-render, so typing keeps focus
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target.id === "name-input") { e.preventDefault(); addNameFromInput(); }
});

state = fresh();
state.screen = "setup";
render();
</script>
</body>
</html>
