<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzards</title>
<link rel="icon" type="image/svg+xml" href="assets/emblem.svg">
<meta name="description" content="A wizard-themed trivia board game for four houses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--accent:#E2B857;--bg:#14182B;--card:#1E2440;--line:#2E3558;--line2:#3A4266;--chip:#2A3156;--text:#F3EFE6;--muted:#A9AEC4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;background:linear-gradient(rgba(20,24,43,.3),rgba(20,24,43,.3)),url(assets/background.jpg) center bottom/cover no-repeat fixed,var(--bg)}
h1 .emblem{width:52px;height:52px;flex:none}
button{font-family:inherit;cursor:pointer}
#app{max-width:1200px;margin:0 auto;padding:36px 24px 56px;display:flex;flex-direction:column;gap:28px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
h1{display:flex;align-items:center;gap:14px;margin:0;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:44px;line-height:1.1;color:var(--accent)}
.scores{display:flex;flex-wrap:wrap;align-items:stretch;gap:12px}
.score,.wager{display:flex;flex-direction:column;gap:4px;min-width:132px;padding:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bar{height:5px}
.score-name{padding:6px 18px 0;font-size:13px;font-weight:600;color:var(--muted)}
.score-num{padding:0 18px;font-size:30px;font-weight:700}
.btn{min-height:48px;padding:0 22px;border-radius:12px;font-size:16px;font-weight:600;border:1px solid var(--line2);background:var(--chip);color:var(--text)}
.btn.ghost{background:transparent;color:var(--muted);min-height:44px;font-size:14px;align-self:center}
.btn.gold{background:var(--accent);color:var(--bg);border:none;font-weight:700}
.btn.big{min-height:52px;padding:0 28px;font-size:17px;align-self:flex-start}
.btn.center{align-self:center}
.btn.right{align-self:flex-end}
.btn:focus-visible,.tile:focus-visible,.back:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.muted{color:var(--muted);margin:0;font-size:16px}
.small{font-size:14px}
.lead{font-size:17px;line-height:1.5}
.board-intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px}
.board-scroll{overflow-x:auto;padding-bottom:4px}
.board{min-width:760px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.head{display:flex;align-items:center;justify-content:center;min-height:64px;padding:8px 10px;background:#232A4A;border-radius:12px;text-align:center;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:17px;line-height:1.2;color:var(--accent)}
.tile{min-height:48px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:22px;font-weight:700}
.tile:hover{border-color:var(--accent)}
.tile.used{background:#171B30;border:1px dashed var(--line)}
.cleared{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:28px 32px;background:var(--card);border:2px solid var(--accent);border-radius:20px}
.cleared>div{display:flex;flex-direction:column;gap:6px}
.cleared-text{font-size:24px;font-weight:600}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.accent{color:var(--accent)}
.narrow{display:flex;flex-direction:column;gap:20px;width:100%;max-width:900px;margin:0 auto}
.narrow.wide{max-width:960px}
.back{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;background:transparent;color:var(--muted);border:none;font-size:15px;font-weight:600}
.card{display:flex;flex-direction:column;gap:28px;padding:44px;background:var(--card);border:1px solid var(--line);border-radius:22px}
.card.final{border:2px solid var(--accent)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.meta-right{display:flex;align-items:center;gap:12px}
.chip{padding:6px 14px;background:var(--chip);border-radius:999px;font-size:14px;font-weight:600}
.dots{display:flex;gap:4px}
.dot{width:8px;height:16px;border-radius:3px}
.pts{font-size:18px;font-weight:700;color:var(--accent)}
.question{margin:0;font-size:34px;font-weight:600;line-height:1.3}
.answer{display:flex;flex-direction:column;gap:6px;padding:20px 24px;background:var(--bg);border:1px solid var(--accent);border-radius:16px}
.answer-text{font-size:28px;font-weight:700;color:var(--accent)}
.label{font-size:15px;font-weight:600;color:var(--muted)}
.btn.house{display:flex;align-items:center;gap:10px}
.pip{width:12px;height:12px;border-radius:6px;display:inline-block;flex:none}
.big-pip{width:14px;height:14px;border-radius:7px}
.final-title{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:30px;color:var(--accent)}
.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.wager{background:var(--bg);gap:8px;padding-bottom:18px}
.wager-name{padding:6px 18px 0;font-size:18px;font-weight:700}
.pad{padding:0 18px}
.wager .label{padding-top:6px;font-size:13px}
.wager input{margin:0 18px;min-height:48px;padding:0 14px;background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:20px;font-weight:700}
.judge-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.row-left{display:flex;align-items:center;gap:12px;font-size:18px}
.btn.judge{min-height:44px;font-size:15px}
.btn.right-on{background:#2F7D4F}
.btn.wrong-on{background:#B23A35}
.winner{display:flex;flex-direction:column;gap:8px;text-align:center;padding:12px 0}
.winner-text{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:40px;line-height:1.2;color:var(--accent)}
.rank{display:flex;align-items:center;gap:16px;padding:16px 22px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.place{width:36px;font-size:22px;font-weight:700;color:var(--muted)}
.rank-name{flex:1 1 auto;font-size:20px;font-weight:700}
.rank-score{min-width:56px;text-align:right;font-size:28px;font-weight:700}
.header-btns{display:flex;gap:8px;align-self:center}
.score.is-turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.btn.left{align-self:flex-start}
.name-row{display:flex;gap:10px;flex-wrap:wrap}
.name-row input{flex:1 1 240px;min-height:48px;padding:0 14px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:17px}
.name-row input::placeholder{color:#8A90A8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.name-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 14px;background:var(--chip);border-radius:999px;font-size:15px;font-weight:600}
.chip-x{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;background:transparent;border:none;color:var(--muted)}
.chip-x:hover{color:var(--text);background:#343B5E}
.hat-card{align-items:center;text-align:center;padding:56px 32px}
.hat-name{font-size:40px;font-weight:700}
.hat-thinking{font-size:24px;font-style:italic;color:var(--muted);min-height:64px;display:flex;align-items:center;animation:pulse 1s ease-in-out infinite alternate}
.hat-house{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:56px;min-height:64px;letter-spacing:.04em;animation:pop .35s ease-out}
.center-row{justify-content:center}
.center-text{text-align:center}
.rosters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.roster{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.roster-name{padding:12px 18px 4px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:22px}
.roster ul{margin:0;padding:4px 18px 18px 36px;display:flex;flex-direction:column;gap:4px;font-size:17px}
.turn-banner{display:flex;align-items:center;gap:14px;padding:16px 22px;background:var(--card);border:2px solid;border-radius:16px}
.turn-text{display:flex;flex-direction:column;gap:2px}
.turn-name{font-size:22px;font-weight:700}
.btn.picker{border-color:var(--accent)}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hat-thinking,.hat-house{animation:none}}
.music-btn{display:inline-flex;align-items:center;gap:8px}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60;display:none}
.splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--house) 28%,transparent),transparent 62%),rgba(10,12,24,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadein .4s ease-out}
.splash-title.tie{font-size:52px}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:720px}
.trophy{width:120px;height:120px;animation:rise .7s cubic-bezier(.2,1.4,.4,1) both}
.splash-title{margin:0;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:72px;line-height:1.05;letter-spacing:.02em;animation:pop .6s .2s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 0 40px color-mix(in srgb,var(--house) 55%,transparent)}
.splash-score{font-size:28px;font-weight:700;color:var(--accent)}
.splash .btn{margin-top:12px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.splash,.trophy,.splash-title{animation:none}}
.join-off{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.join-panel{display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:20px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.qr{width:168px;height:168px;flex:none;background:#fff;border-radius:12px;overflow:hidden}
.qr svg{display:block;width:100%;height:100%}
.join-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.join-url{font-size:15px;color:var(--muted);word-break:break-all}
.join-url strong{color:var(--text)}
.join-code{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:56px;letter-spacing:.14em;line-height:1.1;color:var(--accent)}
.buzz-banner{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 20px;background:var(--bg);border:2px solid;border-radius:16px;animation:pop .3s ease-out}
.buzz-banner .turn-text{flex:1 1 auto}
.wager-in{padding-top:6px;font-size:15px;font-weight:600;color:var(--accent)}
.wager-clear{margin:0 18px;align-self:flex-start}
.phone-answer{font-size:17px;font-weight:600;color:var(--accent)}
.p-form{display:flex;flex-direction:column;gap:10px;width:100%;align-items:stretch}
.buzz-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;font-weight:600}
.buzz-item{display:inline-flex;align-items:center;gap:6px}
.p-card.tight{padding:20px 10px}
.p-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;width:100%}
.p-head{display:flex;align-items:center;justify-content:center;min-height:44px;padding:2px 0;background:#232A4A;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-align:center;color:var(--accent);overflow-wrap:break-word}
.p-tile{min-height:44px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:8px;font-size:18px;font-weight:700;touch-action:manipulation}
.p-tile.used{background:#171B30;border:1px dashed var(--line)}
.p-question{margin:0;font-size:22px;font-weight:600;line-height:1.3}
.p-answer{display:flex;flex-direction:column;gap:4px;align-self:stretch;padding:14px 16px;background:var(--bg);border:1px solid var(--accent);border-radius:14px}
.p-answer-text{font-size:22px;font-weight:700;color:var(--accent)}
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;background:rgba(10,12,24,.82);overflow-y:auto}
.modal-card{width:100%;max-width:640px;display:flex;flex-direction:column;gap:24px;padding:28px;background:var(--card);border:1px solid var(--line2);border-radius:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h2{margin:0}
.menu-sec{display:flex;flex-direction:column;gap:10px}
.menu-h{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn[aria-pressed="true"]{border-color:var(--accent)}
.seg-row{display:flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:12px;overflow:hidden;align-self:flex-start}
.seg{min-height:44px;padding:0 16px;background:transparent;color:var(--text);border:none;border-right:1px solid var(--line2);font-size:15px;font-weight:600}
.seg:last-child{border-right:none}
.seg.on{background:var(--accent);color:var(--bg)}
.seg:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.adj-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adj-name{flex:1 1 110px;font-weight:700}
.adj-score{min-width:44px;text-align:right;font-size:20px;font-weight:700;margin-right:6px}
.btn.adj{min-width:52px;min-height:44px;padding:0 10px}
.menu-btn{display:inline-flex;align-items:center;gap:8px}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer-track{flex:1 1 200px;height:10px;background:#2A3156;border-radius:5px;overflow:hidden}
.timer-fill{display:block;height:100%;width:100%;background:var(--accent);transition:width .25s linear}
.timer-num{min-width:96px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low .timer-fill{background:#E58A6B}
.timer.low .timer-num,.timer.up .timer-num{color:#F0A08A}
.btn.small-btn{min-height:44px;padding:0 14px;font-size:14px;align-self:center}
.net-pill{align-self:center;padding:8px 14px;border-radius:999px;background:#3A2530;color:#F3C6B8;font-size:14px;font-weight:600}
.resume-scores{display:flex;flex-wrap:wrap;gap:10px}
.p-conn{padding:10px 14px;border-radius:12px;background:#3A2530;color:#F3C6B8;font-size:15px;font-weight:600;text-align:center}
.p-timer{align-self:stretch}
.p-timer .timer-num{min-width:0;font-size:20px}
@media (prefers-reduced-motion:reduce){.timer-fill{transition:none}}
.host-block{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.host-qr-wrap{flex-direction:row;flex-wrap:wrap;align-items:center;gap:20px;padding:16px;background:var(--bg);border:1px dashed var(--accent);border-radius:16px}
.small-qr{width:132px;height:132px}
.host-qr-wrap .join-text{flex:1 1 280px}
.host-ok{font-weight:700;color:#8FD3A6}
.host-pill{align-self:center;padding:8px 14px;border-radius:999px;background:#1F3A2C;color:#BDE8CB;font-size:14px;font-weight:600}
.host-chip{background:#3A3216;color:var(--accent)}
.steal-banner{display:flex;flex-direction:column;gap:8px;padding:18px 22px;background:var(--bg);border:2px solid var(--accent);border-radius:16px;animation:pop .3s ease-out}
.steal-title{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:28px;color:var(--accent)}
.steal-timer .timer-fill{background:#7FB3E0}
.answering{margin:0;font-size:22px}
.q-log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:16px;font-weight:600;align-self:stretch;text-align:left}
.q-log li{display:flex;align-items:center;gap:8px}
.big-log{font-size:18px}
.btn.right-btn{background:#2F7D4F;border-color:#2F7D4F}
.btn.wrong-btn{background:#B23A35;border-color:#B23A35}
.tv-judge summary{cursor:pointer;color:var(--muted);font-size:15px;font-weight:600;min-height:44px;display:flex;align-items:center}
.tv-judge[open] summary{margin-bottom:8px}
.judge-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-self:stretch}
.judge-btn{min-height:64px;font-size:18px;font-weight:700}
.judge-btn.right-btn,.judge-btn.wrong-btn{color:#fff}
.h-scores{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:15px}
.h-score{display:inline-flex;align-items:center;gap:6px}
.h-wager,.h-judge{display:flex;flex-direction:column;gap:6px;align-self:stretch;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;text-align:left}
.h-wager-name{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.h-wager-row{display:flex;gap:8px}
.h-wager-row input{flex:1;min-height:48px;padding:0 12px;background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:18px}
.h-rank{display:flex;align-items:center;gap:8px;font-size:18px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.crest{display:block;object-fit:contain;flex:none}
.score.has-crest{min-width:150px}
.score-body{display:flex;align-items:center;gap:10px;padding:6px 16px 0 12px}
.score-text{display:flex;flex-direction:column;gap:2px}
.score-text .score-name,.score-text .score-num{padding:0}
.score-crest{width:40px;height:48px}
.banner-crest{width:44px;height:54px}
.head{flex-direction:column;gap:6px;min-height:104px;padding:10px 8px;background:linear-gradient(rgba(35,42,74,.55),rgba(35,42,74,.75)),url(assets/art/texture.webp) center/cover}
.head-icon{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.tile{display:flex;align-items:center;justify-content:center;min-height:56px;padding:4px;background:linear-gradient(rgba(30,36,64,.35),rgba(30,36,64,.55)),url(assets/art/texture.webp) center/cover;transition:transform .12s ease,border-color .12s ease}
.tile:hover{transform:translateY(-2px)}
.tile-num{height:40px;width:auto;max-width:90%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.tile.used{background:#171B30}
.card{background:linear-gradient(rgba(30,36,64,.55),rgba(30,36,64,.72)),url(assets/art/texture.webp) center/cover}
.cat-chip{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 6px}
.chip-icon{width:30px;height:30px;object-fit:contain}
.sort-hat{width:180px;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.sort-hat.thinking{animation:hatwobble .5s ease-in-out infinite alternate;transform-origin:50% 90%}
.hat-result{display:flex;flex-direction:column;align-items:center;gap:10px}
.reveal-crest{width:120px;height:146px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.roster-head{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.roster-head .roster-name{padding:0}
.roster-crest{width:46px;height:56px}
.splash-crests{display:flex;gap:16px;justify-content:center;animation:rise .7s cubic-bezier(.2,1.4,.4,1) both}
.splash-crest{width:150px;height:184px;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--house) 60%,transparent))}
.splash-crest.small{width:96px;height:118px}
.splash .trophy{width:72px;height:72px}
.p-house{flex-direction:row;justify-content:center;gap:14px;padding:16px;background:color-mix(in srgb,var(--house) 26%,#1E2440);border:2px solid var(--house);color:var(--text)}
.p-house-text{display:flex;flex-direction:column;align-items:flex-start}
.p-crest{width:64px;height:78px}
.p-head{flex-direction:column;gap:2px;min-height:56px}
.p-head-icon{width:24px;height:24px;object-fit:contain}
.p-tile{display:flex;align-items:center;justify-content:center;padding:2px}
.p-num{height:30px;width:auto;max-width:92%;object-fit:contain}

</head>
<body>
<main id="app"></main>
<script src="assets/questions.js"></script>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
var HOUSES = [
  { name: "Gryffindor", color: "#D6453D", crest: "assets/art/crest-gryffindor.webp" },
  { name: "Hufflepuff", color: "#ECB939", crest: "assets/art/crest-hufflepuff.webp" },
  { name: "Ravenclaw", color: "#6E93E0", crest: "assets/art/crest-ravenclaw.webp" },
  { name: "Slytherin", color: "#4FA36A", crest: "assets/art/crest-slytherin.webp" }
];

// Hand-painted artwork. Icons follow the category order in questions.js.
var CAT_ICONS = ["spells", "hogwarts", "characters", "creatures", "quidditch", "potions"];
function crestImg(h, cls) { return '<img class="crest ' + (cls || '') + '" src="' + HOUSES[h].crest + '" alt="">'; }
function catIcon(ci, cls) { return CAT_ICONS[ci] ? '<img class="cat-icon ' + (cls || '') + '" src="assets/art/icon-' + CAT_ICONS[ci] + '.webp" alt="">' : ''; }
function numImg(v, cls) { return '<img class="num ' + (cls || '') + '" src="assets/art/n' + v + '.webp" alt="">'; }

var SEEN_KEY = "quizzards-seen-v1";
function loadSeen() {
  try { return JSON.parse(window.localStorage.getItem(SEEN_KEY) || "{}") || {}; } catch (e) { return {}; }
}
function saveSeen(seen) {
  try { window.localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
}
// Pick a random index from a pool of n, preferring ones not seen yet.
// When every question in the pool has been seen, that pool starts over.
function pickUnseen(n, prefix, seen) {
  var open = [];
  for (var i = 0; i < n; i++) if (!seen[prefix + i]) open.push(i);
  if (open.length === 0) {
    for (var k = 0; k < n; k++) delete seen[prefix + k];
    for (var j = 0; j < n; j++) open.push(j);
  }
  return open[Math.floor(Math.random() * open.length)];
}

var TOTAL_QUESTIONS = CATS.reduce(function (sum, c) {
  return sum + c.qs.reduce(function (s2, pool) { return s2 + pool.length; }, 0);
}, 0);


// ---------- Players and houses ----------
var PLAYERS_KEY = "quizzards-players-v1";
function loadPlayers() {
  try { var p = JSON.parse(window.localStorage.getItem(PLAYERS_KEY) || "[]"); return Array.isArray(p) ? p : []; } catch (e) { return []; }
}
function savePlayers(p) {
  try { window.localStorage.setItem(PLAYERS_KEY, JSON.stringify(p)); } catch (e) {}
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// Teams live outside the game state so "New game" keeps everyone in their houses.
var teams = { players: loadPlayers(), sorted: null, active: [0, 1, 2, 3] };

function membersOf(h) {
  if (!teams.sorted) return [];
  return teams.sorted.filter(function (p) { return p.house === h; }).map(function (p) { return p.name; });
}

// ---------- Game state ----------
var state;
var lastView = "";
var hatTimer = null;

function fresh() {
  var seen = loadSeen();
  var deal = CATS.map(function (c, ci) {
    return c.qs.map(function (pool, li) { return pickUnseen(pool.length, ci + "-" + li + "-", seen); });
  });
  var finalIdx = pickUnseen(FINALS.length, "F-", seen);
  saveSeen(seen);
  return {
    screen: "board", setupStep: "names", revealIdx: 0, thinking: false,
    cat: 0, v: 1, revealed: false,
    // Question flow: qMode "host" (judged on the host phone) or "classic" (judged on this screen).
    // qStage "answer" (a house is answering), "steal" (buzzers open) or done once revealed.
    qMode: "classic", qStage: "answer", qAnswering: null, qTried: [], qLog: [], qBuzz: null, timerKind: "answer",
    turn: Math.floor(Math.random() * teams.active.length),
    scores: [0, 0, 0, 0], used: {}, deal: deal, finalIdx: finalIdx,
    finalStep: "wager", wagers: ["", "", "", ""], judged: [null, null, null, null], before: [0, 0, 0, 0], splash: false
  };
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function markSeen(key) {
  var seen = loadSeen();
  seen[key] = true;
  saveSeen(seen);
}

// ----- Answer timer -----
var tickState = { lastSecs: null, upPlayed: false };
var STEAL_MS = 10000;
function timerStart(kind) {
  tickState = { lastSecs: null, upPlayed: false };
  state.timerKind = kind || "answer";
  if (!timerSecs) { state.timerEnd = null; state.timerLeft = null; state.timerTotal = 0; return; }
  state.timerTotal = state.timerKind === "steal" ? STEAL_MS : timerSecs * 1000;
  state.timerEnd = Date.now() + state.timerTotal;
  state.timerLeft = null;
}
function timerStop() { state.timerEnd = null; state.timerLeft = null; }
function timerRemaining() {
  if (state.timerLeft !== null && state.timerLeft !== undefined) return state.timerLeft;
  if (!state.timerEnd) return null;
  return Math.max(0, state.timerEnd - Date.now());
}
function timerActive() {
  return (state.screen === "question" && !state.revealed) || (state.screen === "final" && state.finalStep === "question");
}
function timerPaused() { return state.timerLeft !== null && state.timerLeft !== undefined; }
function paintTimer(el, rem, total, paused) {
  if (!el) return;
  var secs = Math.ceil(rem / 1000);
  var num = el.querySelector(".timer-num"), fill = el.querySelector(".timer-fill");
  var txt = rem <= 0 ? "Time’s up!" : (paused ? "Paused " : "") + Math.floor(secs / 60) + ":" + ("0" + (secs % 60)).slice(-2);
  if (num && num.textContent !== txt) num.textContent = txt;
  if (fill) fill.style.width = (total ? Math.max(0, Math.min(100, rem / total * 100)) : 0) + "%";
  el.classList.toggle("low", rem > 0 && secs <= 5);
  el.classList.toggle("up", rem <= 0);
}
var TIMER_HTML = '<div class="timer-track" aria-hidden="true"><span class="timer-fill"></span></div><span class="timer-num" role="timer"></span>';

function openQuestion(cat, v) {
  net.buzz = [];
  state.cat = cat; state.v = v; state.revealed = false; state.screen = "question";
  state.qMode = hostOnline() ? "host" : "classic";
  state.qStage = "answer";
  state.qAnswering = turnHouse();
  state.qTried = []; state.qLog = []; state.qBuzz = null;
  timerStart("answer");
  sfx("open");
  render();
}

function currentPair() { return CATS[state.cat].qs[state.v - 1][state.deal[state.cat][state.v - 1]]; }

// The house answering is judged. The first house loses nothing for a miss;
// a house that steals and gets it wrong loses the tile's value.
function judgeAnswer(ok) {
  if (state.screen !== "question" || state.revealed || state.qStage !== "answer" || state.qAnswering === null) return;
  var h = state.qAnswering;
  var steal = h !== turnHouse();
  var d = ok ? state.v : (steal ? -state.v : 0);
  pushUndo(HOUSES[h].name + (ok ? " right" : " wrong") + (d ? " (" + (d > 0 ? "+" : "−") + Math.abs(d) + ")" : ""));
  state.scores = state.scores.slice();
  state.scores[h] += d;
  state.qLog = state.qLog.concat([{ h: h, ok: ok, d: d, steal: steal }]);
  sfx(ok ? "right" : "wrong");
  if (ok) { finishQuestion(); return; }
  state.qTried = state.qTried.concat([h]);
  if (stealers().length) openSteal(); else finishQuestion();
}

function stealers() {
  return teams.active.filter(function (h) { return state.qTried.indexOf(h) < 0; });
}

function openSteal() {
  state.qStage = "steal";
  state.qAnswering = null;
  state.qBuzz = null;
  net.buzz = [];
  timerStart("steal");
  render();
}

function takeSteal(house, name) {
  if (state.screen !== "question" || state.revealed || state.qStage !== "steal") return;
  if (stealers().indexOf(house) < 0) return;
  state.qStage = "answer";
  state.qAnswering = house;
  state.qBuzz = { house: house, name: name || "" };
  timerStart("answer");
  sfx("buzz");
  render();
}

function finishQuestion() {
  timerStop();
  state.revealed = true;
  state.qStage = "done";
  state.qAnswering = null;
  markSeen(state.cat + "-" + (state.v - 1) + "-" + state.deal[state.cat][state.v - 1]);
  render();
}

function nextTurn() {
  var used = Object.assign({}, state.used);
  used[state.cat + "-" + state.v] = true;
  net.buzz = [];
  timerStop();
  setState({ used: used, screen: "board", revealed: false, qStage: "answer", turn: (state.turn + 1) % teams.active.length });
}

function logLine(e) {
  var n = HOUSES[e.h].name;
  if (e.ok) return (e.steal ? n + " stole it! +" : n + " got it! +") + Math.abs(e.d);
  return e.steal ? n + " missed the steal. −" + Math.abs(e.d) : n + " missed.";
}

// ----- Undo -----
var undoStack = [];
function pushUndo(label) {
  undoStack.push({ label: label, state: JSON.stringify(state), fin: JSON.stringify(net.fin) });
  if (undoStack.length > 30) undoStack.shift();
}

// ----- Save and resume -----
var SAVE_KEY = "quizzards-save-v1";
var pendingSave = null;
function saveGame() {
  if (state.screen === "setup" && state.setupStep === "resume") return;
  try {
    var copy = JSON.parse(JSON.stringify(state));
    copy.splash = false; copy.thinking = false;
    window.localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, at: Date.now(), state: copy,
      teams: { players: teams.players, sorted: teams.sorted, active: teams.active },
      room: net.on ? { code: net.code, ids: net.ids, hostKey: net.hostKey } : null
    }));
  } catch (e) {}
}
function loadSave() {
  try {
    var sv = JSON.parse(window.localStorage.getItem(SAVE_KEY) || "null");
    if (!sv || sv.v !== 1 || !sv.state || !sv.teams) return null;
    if (Date.now() - sv.at > 24 * 3600 * 1000) return null;
    if (!Array.isArray(sv.state.deal) || sv.state.deal.length !== CATS.length || !FINALS[sv.state.finalIdx]) return null;
    return sv;
  } catch (e) { return null; }
}
function restoreSave(sv) {
  teams.players = Array.isArray(sv.teams.players) ? sv.teams.players : [];
  teams.sorted = sv.teams.sorted || null;
  teams.active = Array.isArray(sv.teams.active) && sv.teams.active.length ? sv.teams.active : [0, 1, 2, 3];
  state = Object.assign(fresh(), sv.state);
  state.splash = false; state.thinking = false;
  // A running timer comes back paused, so nobody loses time to the reload.
  if (state.timerEnd) { state.timerLeft = Math.max(0, state.timerEnd - Date.now()); state.timerEnd = null; }
  if (sv.room && /^[A-Z]{4}$/.test(sv.room.code)) {
    if (/^[a-z0-9]{6,16}$/.test(sv.room.hostKey || "")) net.hostKey = sv.room.hostKey;
    Object.keys(sv.room.ids || {}).forEach(function (id) { if (teams.players.indexOf(sv.room.ids[id]) >= 0) net.ids[id] = sv.room.ids[id]; });
    enablePhones(sv.room.code);
  }
}

// ----- Host menu -----
var menuOpen = false;
var confirmNew = false;

// ----- Keep the screen awake during a game -----
var wake = { lock: null, pending: false };
function keepAwake(on) {
  if (!navigator.wakeLock) return;
  if (on && !wake.lock && !wake.pending && document.visibilityState === "visible") {
    wake.pending = true;
    navigator.wakeLock.request("screen").then(function (l) {
      wake.lock = l; wake.pending = false;
      l.addEventListener("release", function () { wake.lock = null; });
    }).catch(function () { wake.pending = false; });
  } else if (!on && wake.lock) {
    try { wake.lock.release(); } catch (e) {}
    wake.lock = null;
  }
}

function maxWager(i) { return Math.max(state.scores[i], 10); }
function turnHouse() { return teams.active[state.turn % teams.active.length]; }

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function usedCount() { return Object.keys(state.used).length; }

function hatThink() {
  clearTimeout(hatTimer);
  setState({ thinking: true });
  hatTimer = setTimeout(function () { setState({ thinking: false }); }, 1400);
}

function addNameFromInput() {
  var input = document.getElementById("name-input");
  if (!input) return;
  var names = input.value.split(",").map(function (n) { return n.trim().slice(0, 40); }).filter(Boolean);
  if (!names.length) return;
  teams.players = teams.players.concat(names);
  savePlayers(teams.players);
  render();
  var again = document.getElementById("name-input");
  if (again) again.focus();
}

// ---------- Music and sound (generated in the browser, no audio files) ----------
var MUSIC_KEY = "quizzards-music-v1";
var audio = { ctx: null, master: null, on: false, timer: null, nextTime: 0, step: 0 };
var wantMusic = (function () { try { return window.localStorage.getItem(MUSIC_KEY) === "on"; } catch (e) { return false; } })();

function audioInit() {
  if (audio.ctx) return true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  var ctx = new AC();
  var master = ctx.createGain();
  master.gain.value = 0;
  // A soft echo gives the music-box notes a dreamy tail.
  var delay = ctx.createDelay();
  delay.delayTime.value = 0.36;
  var feedback = ctx.createGain();
  feedback.gain.value = 0.32;
  var wet = ctx.createGain();
  wet.gain.value = 0.28;
  master.connect(ctx.destination);
  master.connect(delay);
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(wet);
  wet.connect(ctx.destination);
  audio.ctx = ctx;
  audio.master = master;
  return true;
}

function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function tone(midi, when, dur, type, vol, dest) {
  var ctx = audio.ctx;
  var osc = ctx.createOscillator();
  var g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = midiHz(midi);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(g);
  g.connect(dest || audio.master);
  osc.start(when);
  osc.stop(when + dur + 0.05);
}

// An original waltz-time loop: D minor, B-flat, G minor, A.
var CHORDS = [
  { bass: 38, arp: [62, 69, 74, 77, 74, 69] },
  { bass: 34, arp: [58, 65, 70, 74, 70, 65] },
  { bass: 43, arp: [55, 62, 67, 70, 67, 62] },
  { bass: 45, arp: [57, 64, 69, 73, 69, 64] }
];
var EIGHTH = 0.3;

function scheduleMusic() {
  var ctx = audio.ctx;
  while (audio.nextTime < ctx.currentTime + 0.4) {
    var bar = Math.floor(audio.step / 6) % CHORDS.length;
    var pos = audio.step % 6;
    var chord = CHORDS[bar];
    var t = audio.nextTime;
    tone(chord.arp[pos], t, 1.1, "triangle", 0.22);
    if (pos === 0) tone(chord.bass, t, EIGHTH * 6, "sine", 0.25);
    if (pos === 3 && Math.floor(audio.step / 6) % 2 === 1) tone(chord.arp[3] + 12, t + EIGHTH / 2, 1.4, "sine", 0.08);
    audio.nextTime += EIGHTH;
    audio.step++;
  }
}

function startMusic() {
  if (!audioInit()) return;
  audio.ctx.resume();
  if (audio.on) return;
  audio.on = true;
  audio.nextTime = audio.ctx.currentTime + 0.1;
  audio.step = 0;
  audio.master.gain.cancelScheduledValues(audio.ctx.currentTime);
  audio.master.gain.setTargetAtTime(0.16, audio.ctx.currentTime, 0.6);
  audio.timer = setInterval(scheduleMusic, 100);
  scheduleMusic();
}

function stopMusic() {
  if (!audio.on) return;
  audio.on = false;
  clearInterval(audio.timer);
  audio.master.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.25);
}

// A short triumphant flourish for the winner. Plays when sound is on.
function playFanfare() {
  if (!wantSfx || !audioInit()) return;
  var ctx = audio.ctx;
  ctx.resume();
  var out = ctx.createGain();
  out.gain.value = 0.5;
  var filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 2400;
  out.connect(filter);
  filter.connect(ctx.destination);
  var t = ctx.currentTime + 0.05;
  [[62, 0, 0.18], [66, 0.18, 0.18], [69, 0.36, 0.18], [74, 0.54, 1.6]].forEach(function (n) {
    tone(n[0], t + n[1], n[2] + 0.25, "sawtooth", 0.09, out);
    tone(n[0] - 12, t + n[1], n[2] + 0.25, "triangle", 0.12, out);
  });
  [62, 66, 69, 74, 78].forEach(function (m) { tone(m, t + 0.54, 2.2, "triangle", 0.07, out); });
}

var SFX_KEY = "quizzards-sfx-v1";
var TIMER_KEY = "quizzards-timer-v1";
function loadPref(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function savePref(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
var wantSfx = loadPref(SFX_KEY) !== "off";
var timerSecs = (function () { var n = parseInt(loadPref(TIMER_KEY), 10); return [0, 30, 45, 60].indexOf(n) >= 0 ? n : 30; })();

// Short sound effects, made in the browser like the music.
function sfx(kind) {
  if (!wantSfx || !audioInit()) return;
  var ctx = audio.ctx;
  try { ctx.resume(); } catch (e) {}
  var t = ctx.currentTime + 0.01, d = ctx.destination;
  if (kind === "buzz") { tone(57, t, 0.35, "square", 0.1, d); tone(69, t, 0.35, "square", 0.06, d); }
  else if (kind === "right") { tone(76, t, 0.2, "triangle", 0.2, d); tone(81, t + 0.12, 0.2, "triangle", 0.2, d); tone(88, t + 0.24, 0.6, "triangle", 0.18, d); }
  else if (kind === "wrong") { tone(52, t, 0.3, "sawtooth", 0.07, d); tone(47, t + 0.22, 0.5, "sawtooth", 0.07, d); }
  else if (kind === "tick") { tone(96, t, 0.06, "square", 0.05, d); }
  else if (kind === "timeup") { tone(64, t, 0.22, "square", 0.08, d); tone(64, t + 0.28, 0.22, "square", 0.08, d); tone(60, t + 0.56, 0.6, "square", 0.08, d); }
  else if (kind === "open") { tone(79, t, 0.14, "triangle", 0.12, d); tone(86, t + 0.09, 0.3, "triangle", 0.1, d); }
}

function toggleMusic() {
  wantMusic = !wantMusic;
  try { window.localStorage.setItem(MUSIC_KEY, wantMusic ? "on" : "off"); } catch (e) {}
  if (wantMusic) startMusic(); else stopMusic();
  render();
}

// ---------- Confetti for the winner ----------
var confetti = { raf: null, parts: [] };
function startConfetti(colors) {
  stopConfetti();
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv = document.getElementById("confetti");
  if (!cv || !cv.getContext) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = window.innerWidth * dpr;
  cv.height = window.innerHeight * dpr;
  cv.style.display = "block";
  var c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = window.innerWidth, H = window.innerHeight;
  var palette = colors.concat(["#E2B857", "#F3EFE6"]);
  confetti.parts = [];
  for (var i = 0; i < 180; i++) {
    confetti.parts.push({
      x: Math.random() * W, y: -20 - Math.random() * H,
      vx: (Math.random() - 0.5) * 1.6, vy: 1.5 + Math.random() * 2.5,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
      color: palette[Math.floor(Math.random() * palette.length)]
    });
  }
  var start = performance.now();
  function frame(now) {
    var elapsed = (now - start) / 1000;
    c.clearRect(0, 0, W, H);
    var alive = 0;
    confetti.parts.forEach(function (p) {
      p.x += p.vx + Math.sin(now / 600 + p.r) * 0.4;
      p.y += p.vy;
      p.r += p.vr;
      if (p.y > H + 20 && elapsed < 5) { p.y = -20; p.x = Math.random() * W; }
      if (p.y <= H + 20) {
        alive++;
        c.save();
        c.translate(p.x, p.y);
        c.rotate(p.r);
        c.fillStyle = p.color;

function hostOnMsg(p) {
  if (p.t === "hello") { hostBroadcast(); return; }
  if (p.t === "join" && typeof p.id === "string" && typeof p.name === "string") {
    var id = p.id.slice(0, 40);
    if (net.ids[id] || Object.keys(net.ids).length >= 60) { hostBroadcast(); return; }
    var name = p.name.replace(/\s+/g, " ").trim().slice(0, 24);
    if (!name) return;
    name = uniqueName(name);
    net.ids[id] = name;
    teams.players.push(name);
    savePlayers(teams.players);
    if (teams.sorted) {
      // Late joiner: put them in the smallest house that's already playing.
      var smallest = teams.active.slice().sort(function (a, b) { return membersOf(a).length - membersOf(b).length; })[0];
      teams.sorted.push({ name: name, house: smallest });
    }
    renderKeepingInput();
    return;
  }
  if ((p.t === "wager" || p.t === "answer") && typeof p.id === "string") {
    var fw = net.ids[p.id];
    var fh = fw ? houseOfName(fw) : null;
    if (!fh || state.screen !== "final" || teams.active.indexOf(fh.house) < 0) return;
    if (p.t === "wager" && state.finalStep === "wager") {
      var amt = parseInt(p.amount, 10);
      if (isNaN(amt)) return;
      amt = Math.min(Math.max(amt, 0), maxWager(fh.house));
      state.wagers[fh.house] = String(amt);

  var badge = '<div class="p-house" style="--house:' + h.color + '">' + crestImg(me.house, 'p-crest') + '<div class="p-house-text"><span class="p-house-name">' + h.name + '</span>' +
    '<span class="p-house-sub">' + esc(me.name) + ' · ' + st.scores[me.house] + ' points</span></div></div>';
  var body;
  var myTurn = st.turn === me.house;
  if (st.phase === "sorting" || st.phase === "rosters" || st.phase === "lobby") {
    body = '<p class="p-big">Welcome to ' + h.name + '!</p><p class="muted">Find your housemates and get ready.</p>';
  } else if (st.phase === "board") {
    var usedMap = {};
    (st.used || []).forEach(function (k) { usedMap[k] = true; });
    var left = CATS.length * 10 - (st.used || []).length;
    if (!left) {
      body = '<p class="p-big">Board cleared!</p><p class="muted">The final question is next.</p>';
    } else if (myTurn) {
      var grid = CATS.map(function (c, ci) { return '<div class="p-head">' + catIcon(ci, 'p-head-icon') + '<span>' + esc(c.name) + '</span></div>'; }).join("");
      for (var v = 1; v <= 10; v++) for (var ci = 0; ci < CATS.length; ci++) {
        grid += usedMap[ci + "-" + v] ? '<div class="p-tile used" aria-hidden="true"></div>'
          : '<button class="p-tile" data-cat="' + ci + '" data-v="' + v + '" aria-label="' + esc(CATS[ci].name) + ' for ' + v + '">' + numImg(v, 'p-num') + '</button>';
      }
      return head + badge + '<div class="p-card tight"><p class="p-big">Your house picks!</p>' +
        '<p class="muted small">Tap a tile. 1 is easiest, 10 is hardest.</p><div class="p-board">' + grid + '</div></div>';
    } else {
      body = '<p class="p-big">' + HOUSES[st.turn].name + ' is picking…</p>';
    }
  } else if (st.phase === "question" || st.phase === "revealed") {
    var q = st.q || { cat: "", v: 0, text: "", answer: null, log: [], tried: [] };
    var qBlock = '<span class="chip">' + esc(q.cat) + ' · ' + q.v + (q.v === 1 ? ' point' : ' points') + '</span>' +
      '<p class="p-question">' + esc(q.text) + '</p>';
    if (st.phase === "question") qBlock += phoneTimerBlock();
    var logHtml = (q.log || []).map(function (e) { return '<li>' + esc(logLine(e)) + '</li>'; }).join("");
    logHtml = logHtml ? '<ul class="q-log">' + logHtml + '</ul>' : '';
    var firstName = HOUSES[q.first] ? HOUSES[q.first].name : "";
    if (st.phase === "revealed") {
      var gotIt = (q.log || []).some(function (e) { return e.ok; });
      body = qBlock + '<div class="p-answer"><span class="eyebrow">Answer</span><span class="p-answer-text">' + esc(q.answer || "") + '</span></div>' +
        logHtml + (gotIt || q.mode === "classic" ? '' : '<p class="muted">Nobody got this one.</p>');
    } else if (q.mode !== "host") {
      body = qBlock + (myTurn ? '<p class="p-big">Your house answers first.</p><p class="muted">Talk it over and say your answer out loud.</p>'
        : '<p class="p-big">' + firstName + ' answers first.</p><p class="muted">If they miss, raise your hand to steal. A wrong steal costs ' + q.v + ' points.</p>') + logHtml;
    } else if (q.stage === "steal") {
      if ((q.tried || []).indexOf(me.house) >= 0) {
        body = qBlock + logHtml + '<p class="p-big">Your house already answered.</p><p class="muted">The other houses can steal.</p>';
      } else {
        body = qBlock + logHtml + '<button class="buzzer" id="p-buzz" style="background:' + h.color + '">' + (ph.buzzed ? 'Buzzed…' : 'Buzz to steal') + '</button>' +
          '<p class="muted">Right: +' + q.v + '. Wrong: −' + q.v + '. First house to buzz answers.</p>';
      }
    } else {
      var ans = q.answering, steal = ans !== q.first, ansName = HOUSES[ans] ? HOUSES[ans].name : "";
      if (ans === me.house) {
        body = qBlock + logHtml + (steal
          ? '<p class="p-big">' + (q.buzz && q.buzz.name === me.name ? 'You buzzed first!' : 'Your house is stealing!') + '</p><p class="muted">Say your answer out loud. Right: +' + q.v + '. Wrong: −' + q.v + '.</p>'
          : '<p class="p-big">Your house answers first.</p><p class="muted">Talk it over and say your answer out loud.</p>');
      } else {
        body = qBlock + logHtml + (steal
          ? '<p class="p-big">' + ansName + ' is stealing.</p>' + (q.buzz && q.buzz.name ? '<p class="muted">' + esc(q.buzz.name) + ' buzzed first.</p>' : '')
          : '<p class="p-big">' + ansName + ' is answering.</p><p class="muted">If they miss, your buzzer opens so you can steal.</p>');
      }
    }
  } else if (st.phase === "final") {
    var f = st.fin || { step: "wager", max: [10, 10, 10, 10], wagerBy: [], answerBy: [] };
    if (f.step === "wager") {
      var wb = f.wagerBy[me.house];
      var mineW = wb && wb.id === ph.id && ph.myWager !== null;
      var wStatus = !wb ? 'Agree on a wager with your house, and keep it secret.'
        : (mineW ? 'Your wager of ' + ph.myWager + ' is in.' : esc(wb.name) + ' set your house’s wager.') + ' You can change it until the host locks it.';
      body = '<span class="chip">Category: ' + esc(f.cat || "") + '</span><p class="p-big">Final question: place your wager</p><p class="muted">' + wStatus + '</p>' +
        '<form id="p-wager" class="p-form" novalidate><label class="label" for="p-wager-in">Wager (0 to ' + f.max[me.house] + ')</label>' +
        '<input id="p-wager-in" type="number" inputmode="numeric" min="0" max="' + f.max[me.house] + '" value="' + (mineW ? ph.myWager : '') + '">' +
        '<button class="btn gold big p-wide" type="submit">' + (wb ? 'Change wager' : 'Lock in wager') + '</button></form>';
    } else if (f.step === "question") {
      var ab = f.answerBy[me.house];
      var mineA = ab && ab.id === ph.id && ph.myAnswer !== null;
      var aStatus = !ab ? 'Type your house’s answer.'
        : (mineA ? 'Your answer is in: “' + esc(ph.myAnswer) + '”.' : esc(ab.name) + ' sent your house’s answer.') + ' You can change it until the host reveals.';
      body = '<span class="chip">Final question</span><p class="p-question">' + esc(f.q || "") + '</p>' + phoneTimerBlock() + '<p class="muted">' + aStatus + '</p>' +
        '<form id="p-answer" class="p-form"><label class="label" for="p-answer-in">Answer</label>' +
        '<input id="p-answer-in" type="text" maxlength="80" autocomplete="off" value="' + (mineA ? esc(ph.myAnswer) : '') + '">' +
        '<button class="btn gold big p-wide" type="submit">' + (ab ? 'Change answer' : 'Send answer') + '</button></form>';
    } else {
      body = '<span class="chip">Final question</span><p class="p-question">' + esc(f.q || "") + '</p>' +
        '<div class="p-answer"><span class="eyebrow">Answer</span><span class="p-answer-text">' + esc(f.a || "") + '</span></div>' +
        '<p class="muted">Answers are locked. The host is checking them.</p>';
    }
  } else {
    var won = st.winners && st.winners.indexOf(me.house) >= 0;
    body = won ? '<p class="p-big">' + h.name + ' wins the House Cup!</p>' : '<p class="p-big">Game over. Thanks for playing!</p>';
  }
  return head + badge + '<div class="p-card">' + body + '</div>';
}

function hostCmd(act, extra) {
  netSend(ph.channel, Object.assign({ t: "cmd", act: act }, extra || {}));
}

function hostPhoneView() {
  var head = '<header class="p-top"><span class="p-brand">Quizzards</span><span class="chip host-chip">Host · Room ' + ROOM + '</span></header>';
  var st = ph.st;
  if (!st) {
    if (ph.status === "error" && ph.fails >= 2) return head + '<div class="p-card"><p class="p-big">Couldn’t connect</p><p class="muted">Check your internet. The page keeps trying on its own.</p></div>';
    return head + '<div class="p-card"><p class="p-big">Connecting to the big screen…</p><p class="muted">Keep the game open on the big screen.</p></div>';
  }
  if (ph.status !== "on" || Date.now() - ph.lastSeen > 9000) head += '<div class="p-conn" role="status">Reconnecting to the game…</div>';
  var undo = st.undo ? '<button class="btn ghost p-wide" data-cmd="undo">Undo: ' + esc(st.undo) + '</button>' : '';
  var scores = '<div class="h-scores">' + st.active.map(function (i) {

  var body = "";

      '<p class="muted">' + n + (n === 1 ? ' player has' : ' players have') + ' joined by phone. Sort the houses and start the game on the big screen. During the game you’ll see every answer here and judge it.</p></div>';
