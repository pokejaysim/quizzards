    } else {
      var used = {};
      (st.used || []).forEach(function (k) { used[k] = true; });
      var grid = CATS.map(function (c, ci) { return '<div class="p-head">' + catIcon(ci, 'p-head-icon') + '<span>' + esc(c.name) + '</span></div>'; }).join("");
      for (var v = 1; v <= 10; v++) for (var ci = 0; ci < CATS.length; ci++) {
        grid += used[ci + "-" + v] ? '<div class="p-tile used" aria-hidden="true"></div>'
          : '<button class="p-tile" data-cmd="pick" data-cat="' + ci + '" data-v="' + v + '" aria-label="' + esc(CATS[ci].name) + ' for ' + v + '">' + numImg(v, 'p-num') + '</button>';
      }
      return head + scores + '<div class="p-card tight"><p class="p-big">' + HOUSES[st.turn].name + ' is picking</p>' +
        '<p class="muted small">Their phones can pick, or tap a tile here for them.</p><div class="p-board">' + grid + '</div>' +
        '<button class="btn ghost" data-cmd="startFinal">Skip to the final question</button></div>' + undo;
    }
  } else if (st.phase === "question" || st.phase === "revealed") {
    var q = st.q;
    var timerCtl = st.timer ? '<div class="timer p-timer" id="p-timer">' + TIMER_HTML + '</div>' +
      '<div class="row"><button class="btn ghost" data-cmd="timerPause">' + (st.timer.paused ? 'Resume timer' : 'Pause timer') + '</button>' +
      '<button class="btn ghost" data-cmd="timerAdd">+15 sec</button></div>' : '';
    var logHtml = (q.log || []).map(function (e) { return '<li>' + esc(logLine(e)) + '</li>'; }).join("");
    logHtml = logHtml ? '<ul class="q-log">' + logHtml + '</ul>' : '';
    body = '<span class="chip">' + esc(q.cat) + ' · ' + q.v + (q.v === 1 ? ' point' : ' points') + '</span>' +
      '<p class="p-question">' + esc(q.text) + '</p>' +
      '<div class="p-answer"><span class="eyebrow">Answer' + (st.phase === "revealed" ? '' : ' (only you can see this)') + '</span><span class="p-answer-text">' + esc(q.answer || "") + '</span></div>' +
      logHtml;
    if (st.phase === "revealed") {
      body += '<button class="btn gold big p-wide" data-cmd="next">Next turn</button>';
    } else if (q.stage === "steal") {
      var open = st.active.filter(function (i) { return (q.tried || []).indexOf(i) < 0; }).map(function (i) { return HOUSES[i].name; });
      body += timerCtl + '<p class="p-big">Buzzers are open</p><p class="muted">' + open.join(", ") + ' can buzz in to steal.</p>' +
        '<button class="btn p-wide" data-cmd="noSteal">No steals, show the answer</button>';
    } else {
      var ans = q.answering, steal = ans !== q.first;
      body += timerCtl + '<p class="p-big">' + HOUSES[ans].name + (steal ? ' is stealing' : ' is answering') + '</p>' +
        (steal && q.buzz && q.buzz.name ? '<p class="muted">' + esc(q.buzz.name) + ' buzzed first.</p>' : '') +
        '<div class="judge-pair"><button class="btn judge-btn right-btn" data-cmd="correct">Correct +' + q.v + '</button>' +
        '<button class="btn judge-btn wrong-btn" data-cmd="wrong">Wrong' + (steal ? ' −' + q.v : '') + '</button></div>' +
        '<p class="muted small">' + (steal ? 'A wrong steal costs ' + q.v + ' points.' : 'A miss opens buzzers for the other houses.') + '</p>' +
        '<button class="btn ghost" data-cmd="noSteal">Show the answer, no more points</button>';
    }
  } else if (st.phase === "final") {
    var f = st.fin;
    body = '<span class="chip">Final · ' + esc(f.cat) + '</span>';
    if (f.step === "wager") {
      body += '<p class="p-big">Wagers</p>' + st.active.map(function (i) {
        var by = f.wagerBy[i];
        return '<form class="h-wager" data-house="' + i + '"><span class="h-wager-name"><span class="pip" style="background:' + HOUSES[i].color + '"></span>' + HOUSES[i].name +
          '<span class="muted small"> max ' + f.max[i] + (by ? ' · from ' + esc(by.name) + '’s phone' : '') + '</span></span>' +
          '<span class="h-wager-row"><label class="sr-only" for="hw-' + i + '">Wager for ' + HOUSES[i].name + '</label>' +
          '<input id="hw-' + i + '" type="number" inputmode="numeric" min="0" max="' + f.max[i] + '" value="' + esc(f.wagers[i]) + '" placeholder="—">' +
          '<button class="btn" type="submit">Set</button></span></form>';
      }).join("") + '<button class="btn gold big p-wide" data-cmd="lockWagers">Lock wagers and show the question</button>';
    } else if (f.step === "question") {
      var inCount = f.answers.filter(function (a) { return a; }).length;
      body += '<p class="p-question">' + esc(f.q) + '</p><div class="p-answer"><span class="eyebrow">Answer (only you can see this)</span><span class="p-answer-text">' + esc(f.a) + '</span></div>' +
        (st.timer ? '<div class="timer p-timer" id="p-timer">' + TIMER_HTML + '</div>' : '') +
        '<p class="muted">' + inCount + ' answer' + (inCount === 1 ? '' : 's') + ' in from phones.</p>' +
        '<button class="btn gold big p-wide" data-cmd="revealFinal">Reveal the answer</button>';
    } else {
      var all = st.active.every(function (i) { return f.judged[i] !== null; });
      body += '<div class="p-answer"><span class="eyebrow">Answer</span><span class="p-answer-text">' + esc(f.a) + '</span></div>' +
        st.active.map(function (i) {
          var w = parseInt(f.wagers[i], 10) || 0, j = f.judged[i];
          return '<div class="h-judge"><span class="h-wager-name"><span class="pip" style="background:' + HOUSES[i].color + '"></span>' + HOUSES[i].name + '<span class="muted small"> wagered ' + w + '</span></span>' +
            (f.answers[i] ? '<span class="phone-answer">“' + esc(f.answers[i]) + '”</span>' : '<span class="muted small">Answer on paper</span>') +
            '<span class="judge-pair"><button class="btn judge-btn' + (j === true ? ' right-on' : '') + '" aria-pressed="' + (j === true) + '" data-cmd="judge" data-house="' + i + '" data-right="1">Right +' + w + '</button>' +
            '<button class="btn judge-btn' + (j === false ? ' wrong-on' : '') + '" aria-pressed="' + (j === false) + '" data-cmd="judge" data-house="' + i + '" data-right="0">Wrong −' + w + '</button></span></div>';
        }).join("") +
        (all ? '<button class="btn gold big p-wide" data-cmd="finishFinal">Crown the House Cup winner</button>' : '<p class="muted">Mark every house to crown the winner.</p>');
    }
  } else {
    var order = st.active.slice().sort(function (a, b) { return st.scores[b] - st.scores[a]; });
    body = '<p class="p-big">Game over</p>' + order.map(function (i, k) {
      return '<div class="h-rank">' + ORD[k] + ' <span class="pip" style="background:' + HOUSES[i].color + '"></span> ' + HOUSES[i].name + ' <strong>' + st.scores[i] + '</strong></div>';
    }).join("") + '<p class="muted">Start the next game from the big screen.</p>';
  }
  return head + scores + '<div class="p-card">' + body + '</div>' + undo;
}

function renderPhone() {
  keepAwake(hostPhone || !!phoneMe());
  var html = hostPhone ? hostPhoneView() : phoneView();
  if (html !== ph.html) {
    ph.html = html;
    // Keep whatever someone is typing when the screen redraws.
    var act = document.activeElement;
    var id = act && act.tagName === "INPUT" ? act.id : "";
    var val = id ? act.value : null;
    document.getElementById("app").innerHTML = html;
    if (id) { var el = document.getElementById(id); if (el) { el.value = val; el.focus(); } }
  }
  paintPhoneTimer();
}

function phoneOnMsg(p) {
  if (p.t !== (hostPhone ? "hstate" : "state") || !Array.isArray(p.players)) return;
  ph.st = p;
  ph.lastSeen = Date.now();
  ph.timer = p.timer ? { left: p.timer.left, total: p.timer.total, paused: p.timer.paused, at: Date.now() } : null;
  if (phoneMe()) { ph.wantJoin = false; ph.wasIn = true; }
  if (p.phase !== "question") ph.buzzed = false;
  if (p.phase !== "final" && p.phase !== "results") { ph.myWager = null; ph.myAnswer = null; }
  renderPhone();
}

function phoneConnect() {
  var gen = ++ph.gen;
  if (ph.channel) { closeChannel(ph.channel); ph.channel = null; }
  ph.status = "connecting";
  ph.lastKick = Date.now();
  openChannel(hostPhone ? ROOM + "-h-" + HOSTKEY : ROOM, phoneOnMsg, function (st) {
    if (gen !== ph.gen) return;
    ph.status = st;
    if (st === "on") { ph.fails = 0; phoneHello(); }
    if (st === "error" || st === "off") { ph.fails++; phoneRetry(); }
    renderPhone();
  }).then(function (ch) {
    if (gen !== ph.gen) { closeChannel(ch); return; }
    ph.channel = ch;
    if (ph.status === "on") phoneHello();
  }).catch(function () {
    if (gen !== ph.gen) return;
    ph.status = "error"; ph.fails++; renderPhone(); phoneRetry();
  });
}

function phoneHello() { netSend(ph.channel, hostPhone ? { t: "hhello" } : { t: "hello", id: ph.id }); }

function phoneRetry() {
  clearTimeout(ph.retry);
  ph.retry = setTimeout(function () { if (ph.status !== "on") phoneConnect(); }, 3000);
}

function startPhone() {
  document.body.classList.add("phone");
  try {
    ph.id = window.localStorage.getItem("quizzards-phone-id") || "";
    ph.name = window.localStorage.getItem("quizzards-phone-name") || "";
  } catch (e) {}
  if (!ph.id) {
    ph.id = "p" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { window.localStorage.setItem("quizzards-phone-id", ph.id); } catch (e) {}
  }
  renderPhone();
  phoneConnect();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    // Phones often drop the connection while the screen is locked.
    if (ph.status !== "on" || Date.now() - ph.lastSeen > 9000) phoneConnect();
    else phoneHello();
    renderPhone();
  });
  setInterval(function () {
    // The host phone says hello on every tick so the big screen knows it's there.
    if (ph.status === "on" && (hostPhone || !ph.st || Date.now() - ph.lastSeen > 8000)) phoneHello();
    if (ph.st && Date.now() - ph.lastSeen > 15000 && Date.now() - ph.lastKick > 15000) phoneConnect();
    if (ph.buzzed && Date.now() - ph.buzzAt > 2500) ph.buzzed = false;
    if (ph.wantJoin && ph.st && !phoneMe()) netSend(ph.channel, { t: "join", id: ph.id, name: ph.name });
    renderPhone();
  }, 3000);
  document.addEventListener("submit", function (e) {
    if (e.target.classList && e.target.classList.contains("h-wager")) {
      e.preventDefault();
      var hh = +e.target.dataset.house;
      var amt = parseInt(document.getElementById("hw-" + hh).value, 10);
      if (!isNaN(amt)) hostCmd("setWager", { house: hh, amount: amt });
      return;
    }
    if (e.target.id === "p-join") { e.preventDefault(); phoneJoin(document.getElementById("p-name").value); }
    if (e.target.id === "p-wager") {
      e.preventDefault();
      var me = phoneMe();
      var n = parseInt(document.getElementById("p-wager-in").value, 10);
      if (!me || isNaN(n) || !ph.st.fin) return;
      n = Math.min(Math.max(n, 0), ph.st.fin.max[me.house]);
      ph.myWager = n;
      netSend(ph.channel, { t: "wager", id: ph.id, amount: n });
      renderPhone();
    }
    if (e.target.id === "p-answer") {
      e.preventDefault();
      var txt = document.getElementById("p-answer-in").value.replace(/\s+/g, " ").trim().slice(0, 80);
      if (!txt) return;
      ph.myAnswer = txt;
      netSend(ph.channel, { t: "answer", id: ph.id, text: txt });
      renderPhone();
    }
  });
  document.addEventListener("click", function (e) {
    var cmd = e.target.closest && e.target.closest("[data-cmd]");
    if (hostPhone) {
      if (!cmd) return;
      var d = cmd.dataset;
      hostCmd(d.cmd, { cat: d.cat, v: d.v, house: d.house, right: d.right === "1" });
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e2) {}
      return;
    }
    if (e.target.closest && e.target.closest("#p-buzz") && !ph.buzzed) phoneBuzz();
    var tile = e.target.closest && e.target.closest("button.p-tile");
    if (tile) netSend(ph.channel, { t: "pick", id: ph.id, cat: +tile.dataset.cat, v: +tile.dataset.v });
  });
}

// ---------- Actions ----------
var actions = {
  addName: function () { addNameFromInput(); },
  removeName: function (el) {
    forgetPhoneName(teams.players[+el.dataset.i]);
    teams.players.splice(+el.dataset.i, 1);
    savePlayers(teams.players);
    render();
  },
  enablePhones: function () { enablePhones(""); },
  clearBuzz: function () { net.buzz = []; render(); },
  clearNames: function () { net.ids = {}; teams.players = []; savePlayers(teams.players); render(); },
  sortPlayers: function () {
    if (!teams.players.length) return;
    undoStack = [];
    stopConfetti(); net.buzz = []; resetFin();
    if (state.screen !== "setup") { state = fresh(); state.screen = "setup"; }
    var names = shuffle(teams.players);
    var order = shuffle([0, 1, 2, 3]);
    teams.sorted = names.map(function (n, i) { return { name: n, house: order[i % 4] }; });
    teams.active = [0, 1, 2, 3].filter(function (h) { return membersOf(h).length > 0; });
    setState({ setupStep: "reveal", revealIdx: 0 });
    hatThink();
  },
  nextReveal: function () {
    if (state.revealIdx < teams.sorted.length - 1) {
      setState({ revealIdx: state.revealIdx + 1 });
      hatThink();
    } else {
      setState({ setupStep: "rosters", thinking: false });
    }
  },
  skipReveal: function () { clearTimeout(hatTimer); setState({ setupStep: "rosters", thinking: false }); },
  skipSorting: function () {
    undoStack = [];
    teams.sorted = null;
    teams.active = [0, 1, 2, 3];
    state = fresh();
    render();
  },
  startGame: function () { undoStack = []; state = fresh(); render(); },
  players: function () { setState({ screen: "setup", setupStep: "names" }); },
  newGame: function () {
    undoStack = []; confirmNew = false;
    stopConfetti(); net.buzz = []; resetFin();
    net.ids = {}; teams.players = []; savePlayers(teams.players);
    teams.sorted = null; teams.active = [0, 1, 2, 3];
    state = fresh(); state.screen = "setup";
    render();
  },
  reset: function () { undoStack = []; stopConfetti(); net.buzz = []; resetFin(); state = fresh(); render(); },
  pick: function (el) { openQuestion(+el.dataset.cat, +el.dataset.v); },
  reveal: function () { timerStop(); setState({ revealed: true }); },
  correct: function () { judgeAnswer(true); },
  wrong: function () { judgeAnswer(false); },
  noSteal: function () { finishQuestion(); },
  tvSteal: function (el) { takeSteal(+el.dataset.team, ""); },
  next: function () { nextTurn(); },
  penalty: function (el) {
    var h = +el.dataset.team;
    pushUndo(HOUSES[h].name + " wrong steal (−" + state.v + ")");
    state.scores = state.scores.slice();
    state.scores[h] -= state.v;
    state.qLog = state.qLog.concat([{ h: h, ok: false, d: -state.v, steal: true }]);
    sfx("wrong");
    render();
  },
  showHostQr: function () { net.showHostQr = true; if (!net.hostQr) refreshHostQr(); render(); },
  hideHostQr: function () { net.showHostQr = false; render(); },
  newHostLink: function () {
    net.hostKey = genHostKey(); net.hostSeen = 0; net.showHostQr = true;
    refreshHostQr();
    if (net.on) hostConnect();
    render();
  },
  useHostPhone: function () { if (!net.on) enablePhones(""); actions.showHostQr(); },
  back: function () { net.buzz = []; timerStop(); setState({ screen: "board", revealed: false }); },
  award: function (el) {
    var team = +el.dataset.team;
    pushUndo(team >= 0 ? HOUSES[team].name + " +" + state.v : "No one, " + CATS[state.cat].name + " " + state.v);
    sfx(team >= 0 ? "right" : "wrong");
    timerStop();
    var scores = state.scores.slice();
    if (team >= 0) scores[team] += state.v;
    var used = Object.assign({}, state.used);
    used[state.cat + "-" + state.v] = true;
    markSeen(state.cat + "-" + (state.v - 1) + "-" + state.deal[state.cat][state.v - 1]);
    net.buzz = [];
    setState({ scores: scores, used: used, screen: "board", revealed: false, turn: (state.turn + 1) % teams.active.length });
  },
  clearWager: function (el) { var i = +el.dataset.house; state.wagers[i] = ""; net.fin.wagerBy[i] = null; render(); },
  startFinal: function () { resetFin(); setState({ screen: "final", finalStep: "wager", wagers: ["", "", "", ""], judged: [null, null, null, null] }); },
  lockWagers: function () {
    var w = state.wagers.map(function (raw, i) {
      var n = parseInt(raw, 10);
      if (isNaN(n)) n = 0;
      return String(Math.min(Math.max(n, 0), maxWager(i)));
    });
    state.wagers = w;
    state.finalStep = "question";
    timerStart();
    render();
  },
  revealFinal: function () { markSeen("F-" + state.finalIdx); timerStop(); setState({ finalStep: "judge" }); },
  judge: function (el) {
    var a = state.judged.slice();
    a[+el.dataset.house] = el.dataset.right === "1";
    setState({ judged: a });
  },
  finishFinal: function () {
    pushUndo("final question scores");
    var next = state.scores.map(function (sc, i) {
      if (teams.active.indexOf(i) < 0) return sc;
      var w = parseInt(state.wagers[i], 10) || 0;
      return state.judged[i] ? sc + w : sc - w;
    });
    setState({ before: state.scores.slice(), scores: next, finalStep: "results", splash: true });
    startConfetti(winners().map(function (i) { return HOUSES[i].color; }));
    playFanfare();
  },
  closeSplash: function () { stopConfetti(); setState({ splash: false }); },
  toggleMusic: function () { toggleMusic(); },
  toggleSfx: function () { wantSfx = !wantSfx; savePref(SFX_KEY, wantSfx ? "on" : "off"); if (wantSfx) sfx("right"); render(); },
  setTimer: function (el) { timerSecs = +el.dataset.val; savePref(TIMER_KEY, String(timerSecs)); render(); },
  openMenu: function () { menuOpen = true; confirmNew = false; render(); var b = document.querySelector(".modal .btn"); if (b) b.focus(); },
  closeMenu: function () { menuOpen = false; confirmNew = false; render(); },
  askNewGame: function () { confirmNew = true; render(); },
  cancelNewGame: function () { confirmNew = false; render(); },
  adjust: function (el) {
    var i = +el.dataset.house, d = +el.dataset.d;
    pushUndo(HOUSES[i].name + (d > 0 ? " +" : " ") + d + " (score fix)");
    state.scores = state.scores.slice();
    state.scores[i] += d;
    render();
  },
  undo: function () {
    var last = undoStack.pop();
    if (!last) return;
    state = JSON.parse(last.state);
    net.fin = JSON.parse(last.fin);
    state.splash = false;
    stopConfetti();
    render();
  },
  timerPause: function () {
    var rem = timerRemaining();
    if (rem === null) return;
    if (state.timerLeft !== null && state.timerLeft !== undefined) { state.timerEnd = Date.now() + state.timerLeft; state.timerLeft = null; }
    else { state.timerLeft = rem; state.timerEnd = null; }
    render();
  },
  timerAdd: function () {
    var rem = timerRemaining();
    if (rem === null) return;
    if (state.timerLeft !== null && state.timerLeft !== undefined) state.timerLeft += 15000;
    else state.timerEnd = Date.now() + rem + 15000;
    state.timerTotal = Math.max(state.timerTotal || 0, rem + 15000);
    tickState.upPlayed = false;
    render();
  },
  resume: function () { var sv = pendingSave; pendingSave = null; undoStack = []; restoreSave(sv); render(); },
  discardSave: function () { pendingSave = null; state.setupStep = "names"; render(); }
};
var MENU_KEEP = ["showHostQr", "hideHostQr", "newHostLink", "useHostPhone", "openMenu", "toggleMusic", "toggleSfx", "setTimer", "adjust", "askNewGame", "cancelNewGame", "timerPause", "timerAdd"];

// ---------- Views ----------
function viewHeader() {
  var playing = state.screen !== "setup";
  var cards = playing ? teams.active.map(function (i) {
    var h = HOUSES[i];
    var isTurn = state.screen === "board" && i === turnHouse();
    return '<div class="score has-crest' + (isTurn ? ' is-turn' : '') + '"><span class="bar" style="background:' + h.color + '"></span>' +
      '<div class="score-body">' + crestImg(i, 'score-crest') + '<div class="score-text"><span class="score-name">' + h.name + '</span><span class="score-num">' + state.scores[i] + '</span></div></div></div>';
  }).join("") : "";
  var netPill = net.on && net.status !== "on" ? '<span class="net-pill" role="status">Phones reconnecting…</span>'
    : hostOnline() ? '<span class="host-pill">Host on phone</span>' : '';
  var undoBtn = playing && undoStack.length ? '<button class="btn ghost" data-action="undo" title="Undo: ' + esc(undoStack[undoStack.length - 1].label) + '">Undo</button>' : '';
  var buttons = '<div class="header-btns">' + netPill + undoBtn +
    '<button class="btn ghost menu-btn" data-action="openMenu" aria-haspopup="dialog">' +
    '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Menu</button></div>';
  return '<header class="top"><h1><img class="emblem" src="assets/emblem.svg" alt="">Quizzards</h1><div class="scores">' + cards + buttons + '</div></header>';
}

function viewMenu() {
  var playing = state.screen !== "setup";
  var scores = "";
  if (playing) {
    scores = '<div class="menu-sec"><h3 class="menu-h">Fix scores</h3><div class="stack-sm">' + teams.active.map(function (i) {
      return '<div class="adj-row"><span class="pip" style="background:' + HOUSES[i].color + '"></span><span class="adj-name">' + HOUSES[i].name + '</span>' +
        '<span class="adj-score">' + state.scores[i] + '</span>' +
        [-5, -1, 1, 5].map(function (d) {
          return '<button class="btn adj" data-action="adjust" data-house="' + i + '" data-d="' + d + '" aria-label="' + (d > 0 ? 'Add ' : 'Take away ') + Math.abs(d) + ' for ' + HOUSES[i].name + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</button>';
        }).join("") + '</div>';
    }).join("") + '</div>' +
    (undoStack.length ? '<button class="btn left" data-action="undo">Undo: ' + esc(undoStack[undoStack.length - 1].label) + '</button>' : '<span class="muted small">Nothing to undo yet.</span>') + '</div>';
  }
  var timerBtns = [0, 30, 45, 60].map(function (t) {
    var on = timerSecs === t;
    return '<button class="seg' + (on ? ' on' : '') + '" data-action="setTimer" data-val="' + t + '" aria-pressed="' + on + '">' + (t ? t + ' sec' : 'Off') + '</button>';
  }).join("");
  var game = confirmNew
    ? '<p class="muted">This clears every player and house' + (net.on ? ', and sends phones back to the join screen' : '') + '.</p><div class="row"><button class="btn gold" data-action="newGame">Yes, start over</button><button class="btn ghost" data-action="cancelNewGame">Cancel</button></div>'
    : '<div class="row">' + (playing ? '<button class="btn" data-action="players">Players and houses</button><button class="btn" data-action="reset">Restart, same houses</button>' : '') +
      '<button class="btn" data-action="askNewGame">Start over with new players</button></div>';
  return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="menu-title"><div class="modal-card">' +
    '<div class="modal-head"><h2 id="menu-title" class="final-title">Host menu</h2><button class="btn ghost" data-action="closeMenu">Close</button></div>' +
    '<div class="menu-sec"><h3 class="menu-h">Sound</h3><div class="row">' +
      '<button class="btn" data-action="toggleMusic" aria-pressed="' + wantMusic + '">Music: ' + (wantMusic ? 'on' : 'off') + '</button>' +
      '<button class="btn" data-action="toggleSfx" aria-pressed="' + wantSfx + '">Sound effects: ' + (wantSfx ? 'on' : 'off') + '</button></div></div>' +
    '<div class="menu-sec"><h3 class="menu-h">Answer timer</h3><div class="seg-row" role="group" aria-label="Answer timer length">' + timerBtns + '</div>' +
      '<span class="muted small">Starts when a question opens. A change applies from the next question.</span></div>' +
    '<div class="menu-sec"><h3 class="menu-h">Host phone</h3>' +
      (net.on ? viewHostPhoneBlock() : '<div class="row"><button class="btn" data-action="useHostPhone">Set up the host phone</button></div>' +
        '<span class="muted small">The host sees each answer privately and judges from their phone.</span>') + '</div>' +
    scores +
    '<div class="menu-sec"><h3 class="menu-h">Game</h3>' + game + '</div>' +
    '</div></div>';
}

function viewTimer() {
  if (!timerActive() || timerRemaining() === null) return "";
  var paused = timerPaused();
  return '<div class="timer' + (state.timerKind === "steal" ? ' steal-timer' : '') + '" id="h-timer">' + TIMER_HTML +
    '<button class="btn ghost small-btn" data-action="timerPause">' + (paused ? 'Resume' : 'Pause') + '</button>' +
    '<button class="btn ghost small-btn" data-action="timerAdd">+15 sec</button></div>';
}

function viewResume() {
  var sv = pendingSave;
  var mins = Math.max(1, Math.round((Date.now() - sv.at) / 60000));
  var ago = mins < 60 ? mins + (mins === 1 ? ' minute' : ' minutes') + ' ago' : Math.round(mins / 60) + (Math.round(mins / 60) === 1 ? ' hour' : ' hours') + ' ago';
  var act = Array.isArray(sv.teams.active) && sv.teams.active.length ? sv.teams.active : [0, 1, 2, 3];
  var cards = act.map(function (i) {
    return '<div class="score"><span class="bar" style="background:' + HOUSES[i].color + '"></span><span class="score-name">' + HOUSES[i].name + '</span><span class="score-num">' + (sv.state.scores[i] || 0) + '</span></div>';
  }).join("");
  var played = Object.keys(sv.state.used || {}).length;
  return '<section class="narrow"><div class="card">' +
    '<div class="stack-sm"><span class="final-title">Pick up where you left off?</span>' +
    '<p class="muted lead">A game was saved ' + ago + ', with ' + played + ' of ' + (CATS.length * 10) + ' tiles played.' +
    (sv.room ? ' Phones will reconnect on their own.' : '') + '</p></div>' +
    '<div class="resume-scores">' + cards + '</div>' +
    '<div class="row"><button class="btn gold big" data-action="resume">Resume the game</button>' +
    '<button class="btn ghost" data-action="discardSave">Start a new game</button></div></div></section>';
}

function viewSetup() {
  if (state.setupStep === "resume" && pendingSave) return viewResume();
  if (state.setupStep === "names" || state.setupStep === "resume") {
    var chips = teams.players.map(function (n, i) {
      return '<span class="name-chip">' + esc(n) + '<button class="chip-x" data-action="removeName" data-i="' + i + '" aria-label="Remove ' + esc(n) + '">' +
        '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>';
    }).join("");
    var count = teams.players.length;
    return '<section class="narrow"><div class="card">' +
      '<div class="stack-sm"><span class="final-title">The Sorting Ceremony</span>' +
      '<p class="muted lead">Add every player, then let the Sorting Hat put everyone into a house. Houses are kept as even as possible. With fewer than four players, only the houses that get someone will play.</p></div>' +
      '<div class="stack-sm"><label class="label" for="name-input">Player name</label>' +
      '<div class="name-row"><input id="name-input" type="text" maxlength="200" autocomplete="off" placeholder="Type a name and press Enter">' +
      '<button class="btn" data-action="addName">Add</button></div>' +
      '<span class="muted small">Tip: paste several names at once, separated by commas.</span></div>' +
      viewJoinPanel() +
      (count ? '<div class="stack-sm"><span class="label">' + count + (count === 1 ? ' player' : ' players') + '</span><div class="chips">' + chips + '</div>' +
        '<button class="btn ghost left" data-action="clearNames">Clear all</button></div>' : '') +
      '<div class="row">' +
      (count ? '<button class="btn gold big" data-action="sortPlayers">Sort everyone</button>' : '') +
      '<button class="btn ghost" data-action="skipSorting">Skip, we already have teams</button></div>' +
      '</div></section>';
  }
  if (state.setupStep === "reveal") {
    var p = teams.sorted[state.revealIdx];
    var total = teams.sorted.length;
    var last = state.revealIdx === total - 1;
    var result = state.thinking
      ? '<span class="hat-thinking">Hmm, difficult. Very difficult…</span>'
      : '<span class="hat-result">' + crestImg(p.house, 'reveal-crest') + '<span class="hat-house" style="color:' + HOUSES[p.house].color + '">' + HOUSES[p.house].name.toUpperCase() + '!</span></span>';
    return '<section class="narrow"><div class="card hat-card">' +
      '<img class="sort-hat' + (state.thinking ? ' thinking' : '') + '" src="assets/art/hat.webp" alt="">' +
      '<span class="eyebrow">Player ' + (state.revealIdx + 1) + ' of ' + total + '</span>' +
      '<span class="hat-name">' + esc(p.name) + '</span>' + result +
      '<div class="row center-row">' +
      (state.thinking ? '' : '<button class="btn gold big" data-action="nextReveal">' + (last ? 'See the houses' : 'Next player') + '</button>') +
      '<button class="btn ghost" data-action="skipReveal">Skip to the results</button></div>' +
      '</div></section>';
  }
  var cols = teams.active.map(function (h) {
    var names = membersOf(h).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join("");
    return '<div class="roster"><span class="bar" style="background:' + HOUSES[h].color + '"></span>' +
      '<div class="roster-head">' + crestImg(h, 'roster-crest') + '<span class="roster-name">' + HOUSES[h].name + '</span></div><ul>' + names + '</ul></div>';
  }).join("");
  return '<section class="stack"><div class="stack-sm"><span class="final-title">Your houses</span>' +
    '<p class="muted">Sit with your house. Each house takes turns picking from the board.</p></div>' +
    '<div class="rosters">' + cols + '</div>' +
    '<div class="row"><button class="btn gold big" data-action="startGame">Start the game</button>' +
    '<button class="btn ghost" data-action="sortPlayers">Sort again</button>' +
    '<button class="btn ghost" data-action="players">Edit players</button></div></section>';
}

function viewTurnBanner() {
  var h = turnHouse();
  var members = membersOf(h);
  return '<div class="turn-banner" style="border-color:' + HOUSES[h].color + '">' + crestImg(h, 'banner-crest') +
    '<div class="turn-text"><span class="turn-name">' + HOUSES[h].name + '’s turn to pick</span>' +
    (members.length ? '<span class="muted small">' + members.map(esc).join(", ") + '</span>' : '') +
    '</div></div>';
}

function viewBoard() {
  var heads = CATS.map(function (c, ci) { return '<div class="head">' + catIcon(ci, 'head-icon') + '<span>' + esc(c.name) + '</span></div>'; }).join("");
  var tiles = "";
  for (var v = 1; v <= 10; v++) {
    for (var ci = 0; ci < CATS.length; ci++) {
      if (state.used[ci + "-" + v]) {
        tiles += '<div class="tile used" aria-hidden="true"></div>';
      } else {
        tiles += '<button class="tile" data-action="pick" data-cat="' + ci + '" data-v="' + v + '" aria-label="' +
          esc(CATS[ci].name) + ' for ' + v + (v === 1 ? ' point' : ' points') + '">' + numImg(v, 'tile-num') + '</button>';
      }
    }
  }
  var done = usedCount() === CATS.length * 10;
  var finalBlock = done
    ? '<div class="cleared"><div><span class="eyebrow accent">Board cleared</span><span class="cleared-text">Time for the final question.</span></div>' +
      '<button class="btn gold" data-action="startFinal">Go to the final question</button></div>'
    : '<button class="btn ghost right" data-action="startFinal">Skip to the final question</button>';
  return '<section class="stack">' + (done ? '' : viewTurnBanner()) +
    '<div class="board-scroll"><div class="board">' + heads + tiles + '</div></div>' + finalBlock + '</section>';
}

function viewQuestion() {
  var c = CATS[state.cat];
  var pair = currentPair();
  var th = turnHouse();
  var dots = "";
  for (var d = 1; d <= 10; d++) dots += '<span class="dot" style="background:' + (d <= state.v ? "var(--accent)" : "#3A4266") + '"></span>';
  var logHtml = state.qLog.map(function (e) {
    return '<li><span class="pip" style="background:' + HOUSES[e.h].color + '"></span>' + esc(logLine(e)) + '</li>';
  }).join("");
  logHtml = logHtml ? '<ul class="q-log big-log">' + logHtml + '</ul>' : '';
  var answerBox = '<div class="answer"><span class="eyebrow">Answer</span><span class="answer-text">' + esc(pair[1]) + '</span></div>';
  var body;
  if (state.qMode === "host") {
    var online = hostOnline();
    if (state.revealed) {
      var got = state.qLog.some(function (e) { return e.ok; });
      body = answerBox + logHtml + (got ? '' : '<p class="muted lead">Nobody got this one.</p>') +
        '<button class="btn gold big" data-action="next">Next turn</button>';
    } else if (state.qStage === "steal") {
      var open = stealers();
      body = logHtml + '<div class="steal-banner"><span class="steal-title">Buzzers are open!</span>' +
        '<span class="buzz-line">' + open.map(function (i) {
          return '<span class="buzz-item"><span class="pip" style="background:' + HOUSES[i].color + '"></span>' + HOUSES[i].name + '</span>';
        }).join("") + '</span>' +
        '<span class="muted">First house to buzz on a phone can steal. Right: +' + state.v + '. Wrong: −' + state.v + '.</span></div>' +
        viewTimer() +
        '<div class="row">' + (online ? '' : open.map(function (i) {
          return '<button class="btn house" data-action="tvSteal" data-team="' + i + '"><span class="pip" style="background:' + HOUSES[i].color + '"></span>' + HOUSES[i].name + ' steals</button>';
        }).join("")) + '<button class="btn ghost" data-action="noSteal">No steals, show the answer</button></div>';
    } else {
      var ans = state.qAnswering, steal = ans !== th;
      var who = '<p class="lead answering"><strong style="color:' + HOUSES[ans].color + '">' + HOUSES[ans].name + '</strong>' +
        (steal ? ' is stealing!' + (state.qBuzz && state.qBuzz.name ? ' ' + esc(state.qBuzz.name) + ' buzzed first.' : '') : ' answers first.') + '</p>';
      var judgeBtns = '<div class="row"><button class="btn right-btn" data-action="correct">Correct +' + state.v + '</button>' +
        '<button class="btn wrong-btn" data-action="wrong">Wrong' + (steal ? ' −' + state.v : '') + '</button>' +
        '<button class="btn ghost" data-action="noSteal">Show the answer</button></div>';
      body = logHtml + who + viewTimer() +
        (online ? '<p class="muted">The host is judging on their phone.</p>' +
          '<details class="tv-judge"><summary>Judge from this screen instead</summary>' + judgeBtns + '</details>'
        : '<p class="muted">The host phone isn’t connected, so judge here.</p>' + judgeBtns);
    }
  } else if (!state.revealed) {
    var stealNote = teams.active.length > 1
      ? ' If they miss, other houses can raise a hand to steal. A wrong steal costs ' + state.v + (state.v === 1 ? ' point.' : ' points.')
      : '';
    var others = teams.active.filter(function (h) { return h !== th; });
    body = logHtml + '<p class="muted lead"><strong class="turn-inline" style="color:' + HOUSES[th].color + '">' + HOUSES[th].name + '</strong> answers first.' + stealNote + '</p>' + viewTimer() +
      '<button class="btn gold big" data-action="reveal">Reveal answer</button>' +
      (others.length ? '<details class="tv-judge"><summary>Wrong steal before the reveal?</summary><div class="row">' + others.map(function (i) {
        return '<button class="btn" data-action="penalty" data-team="' + i + '">' + HOUSES[i].name + ' −' + state.v + '</button>';
      }).join("") + '</div></details>' : '');
  } else {
    var order = [th].concat(teams.active.filter(function (h) { return h !== th; }));
    var houseBtns = order.map(function (i) {
      var h = HOUSES[i];
      var label = i === th ? h.name + ' +' + state.v : h.name + ' steals +' + state.v;
      return '<button class="btn house' + (i === th ? ' picker' : '') + '" data-action="award" data-team="' + i + '"><span class="pip" style="background:' + h.color + '"></span>' +
        label + '</button>';
    }).join("");
    body = answerBox + logHtml +
      '<div class="stack-sm"><span class="label">Who got it?</span><div class="row">' + houseBtns +
      '<button class="btn ghost" data-action="award" data-team="-1">No one</button></div></div>';
  }
  return '<section class="narrow"><button class="back" data-action="back">' +
    '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back to the board</button>' +
    '<div class="card"><div class="meta"><span class="chip cat-chip">' + catIcon(state.cat, 'chip-icon') + esc(c.name) + '</span><div class="meta-right"><span class="muted small">Difficulty</span>' +
    '<span class="dots">' + dots + '</span><span class="pts">' + state.v + (state.v === 1 ? ' point' : ' points') + '</span></div></div>' +
    '<p class="question">' + esc(pair[0]) + '</p>' + body + '</div></section>';
}

function viewFinal() {
  var fq = FINALS[state.finalIdx];
  var act = teams.active;
  var inner = "";
  var phonesOn = net.on && Object.keys(net.ids).length > 0;
  if (state.finalStep === "wager") {
    var cards = act.map(function (i) {
      var h = HOUSES[i];
      return '<div class="wager"><span class="bar" style="background:' + h.color + '"></span>' +
        '<span class="wager-name">' + h.name + '</span><span class="muted small pad">Score ' + state.scores[i] + ' · max wager ' + maxWager(i) + '</span>' +
        (net.fin.wagerBy[i]
          ? '<span class="pad wager-in">Wager received from ' + esc(net.fin.wagerBy[i].name) + '’s phone</span>' +
            '<button class="btn ghost wager-clear" data-action="clearWager" data-house="' + i + '">Enter by hand instead</button>'
          : '<label class="label pad" for="wager-' + i + '">Wager</label>' +
            '<input id="wager-' + i + '" data-wager="' + i + '" type="number" min="0" max="' + maxWager(i) + '" inputmode="numeric" value="' + esc(state.wagers[i]) + '">') +
        '</div>';
    }).join("");
    inner = '<p class="muted lead">Each house secretly writes down a wager, from 0 up to its current score. A house with fewer than 10 points can wager up to 10. Enter the wagers, then show the question. A right answer adds the wager, and a wrong one takes it away.' +
      (phonesOn ? ' Houses with a phone can enter their wager there, and it stays hidden here.' : '') + '</p>' +
      '<div class="wagers">' + cards + '</div><button class="btn gold big" data-action="lockWagers">Lock wagers and show the question</button>';
  } else if (state.finalStep === "question") {
    var answered = act.filter(function (i) { return net.fin.answers[i]; }).map(function (i) { return HOUSES[i].name; });
    inner = '<p class="question">' + esc(fq.q) + '</p>' + viewTimer() + '<p class="muted">Each house writes down its answer' + (phonesOn ? ', or types it on a phone' : '') + (timerRemaining() !== null ? ', before time runs out' : '') + '.</p>' +
      (phonesOn ? '<p class="muted small">Answers in from phones: ' + (answered.length ? answered.join(", ") : 'none yet') + '</p>' : '') +
      '<button class="btn gold big" data-action="revealFinal">Reveal answer</button>';
  } else if (state.finalStep === "judge") {
    var rows = act.map(function (i) {
      var h = HOUSES[i];
      var j = state.judged[i];
      var w = parseInt(state.wagers[i], 10) || 0;
      return '<div class="judge-row"><div class="row-left"><span class="pip" style="background:' + h.color + '"></span><strong>' + h.name + '</strong>' +
        '<span class="muted">wagered ' + w + '</span>' +
        (net.fin.answers[i] ? '<span class="phone-answer">“' + esc(net.fin.answers[i].text) + '”</span>' : '') +
        '</div><div class="row">' +
        '<button class="btn judge' + (j === true ? ' right-on' : '') + '" aria-pressed="' + (j === true) + '" data-action="judge" data-house="' + i + '" data-right="1">Right +' + w + '</button>' +
        '<button class="btn judge' + (j === false ? ' wrong-on' : '') + '" aria-pressed="' + (j === false) + '" data-action="judge" data-house="' + i + '" data-right="0">Wrong −' + w + '</button></div></div>';
    }).join("");
    var all = act.every(function (i) { return state.judged[i] !== null; });
    inner = '<p class="question">' + esc(fq.q) + '</p>' +
      '<div class="answer"><span class="eyebrow">Answer</span><span class="answer-text">' + esc(fq.a) + '</span></div>' +
      '<span class="label">Mark each house right or wrong</span><div class="stack-sm">' + rows + '</div>' +
      (all ? '<button class="btn gold big" data-action="finishFinal">Crown the House Cup winner</button>'
           : '<span class="muted">Mark every house to see the winner.</span>');
  } else {
    var idx = act.slice().sort(function (a, b) { return state.scores[b] - state.scores[a]; });
    var places = ["1st", "2nd", "3rd", "4th"];
    var rank = idx.map(function (i, k) {
      var dd = state.scores[i] - state.before[i];
      var delta = dd > 0 ? "+" + dd : dd < 0 ? "−" + Math.abs(dd) : "±0";
      return '<div class="rank"><span class="place">' + places[k] + '</span><span class="pip big-pip" style="background:' + HOUSES[i].color + '"></span>' +
        '<span class="rank-name">' + HOUSES[i].name + '</span><span class="muted">final question ' + delta + '</span><span class="rank-score">' + state.scores[i] + '</span></div>';
    }).join("");
    var top = Math.max.apply(null, act.map(function (i) { return state.scores[i]; }));
    var names = act.filter(function (i) { return state.scores[i] === top; }).map(function (i) { return HOUSES[i].name; });
    var winner = names.length === 1 ? names[0] + " wins the House Cup!"
      : names.length === act.length && act.length > 2 ? "Everyone ties!"
      : "It's a tie: " + names.slice(0, -1).join(", ") + " and " + names[names.length - 1] + "!";
    inner = '<div class="winner"><span class="eyebrow">The House Cup</span><span class="winner-text">' + esc(winner) + '</span></div>' +
      '<div class="stack-sm">' + rank + '</div><div class="row center-row"><button class="btn gold big" data-action="newGame">Start a new game</button>' +
      '<button class="btn ghost" data-action="reset">Replay with the same houses</button></div>' +
      '<p class="muted small center-text">Starting a new game clears all players' + (net.on ? ' and sends every phone back to the join screen. The room code stays the same.' : '.') + '</p>';
  }
  return '<section class="narrow wide"><div class="card final"><div class="meta"><span class="final-title">Final Question</span>' +
    '<span class="chip">Category: ' + esc(fq.cat) + '</span></div>' + inner + '</div></section>';
}

function render() {
  if (phoneMode) { renderPhone(); return; }
  var main = state.screen === "setup" ? viewSetup()
    : state.screen === "board" ? viewBoard()
    : state.screen === "question" ? viewQuestion()
    : viewFinal();
  var showSplash = state.screen === "final" && state.finalStep === "results" && state.splash;
  if (!showSplash && confetti.raf) stopConfetti();
  document.getElementById("app").innerHTML = viewHeader() + main + (showSplash ? viewSplash() : "") + (menuOpen ? viewMenu() : "");
  if (showSplash && !menuOpen) { var sb = document.querySelector(".splash .btn"); if (sb) sb.focus(); }
  if (timerActive() && timerRemaining() !== null) paintTimer(document.getElementById("h-timer"), timerRemaining(), state.timerTotal, state.timerLeft !== null && state.timerLeft !== undefined);
  saveGame();
  keepAwake(state.screen !== "setup" || net.on);
  var key = state.screen + "/" + state.finalStep + "/" + state.setupStep;
  if (key !== lastView) window.scrollTo(0, 0);
  lastView = key;
  hostBroadcast();
}

// ---------- Wiring ----------
document.addEventListener("click", function (e) {
  if (phoneMode) return;
  var el = e.target.closest("[data-action]");
  if (wantMusic && !audio.on && !(el && el.dataset.action === "toggleMusic")) startMusic();
  if (!el || !actions[el.dataset.action]) return;
  if (menuOpen && MENU_KEEP.indexOf(el.dataset.action) < 0) { menuOpen = false; confirmNew = false; }
  actions[el.dataset.action](el);
});
document.addEventListener("input", function (e) {
  var i = e.target.dataset && e.target.dataset.wager;
  if (i !== undefined) state.wagers[+i] = e.target.value; // no re-render, so typing keeps focus
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target.id === "name-input") { e.preventDefault(); addNameFromInput(); }
  if (e.key === "Escape" && menuOpen) { actions.closeMenu(); var mb = document.querySelector(".menu-btn"); if (mb) mb.focus(); return; }
  if (e.key === "Escape" && state.splash) actions.closeSplash();
});

// Host timer: redraw the countdown and play the ticks.
var lastHostOnline = false;
setInterval(function () {
  if (phoneMode) { paintPhoneTimer(); return; }
  if (state && hostOnline() !== lastHostOnline) { lastHostOnline = hostOnline(); renderKeepingInput(); }
  if (!state || !timerActive()) return;
  var rem = timerRemaining();
  if (rem === null) return;
  var paused = state.timerLeft !== null && state.timerLeft !== undefined;
  paintTimer(document.getElementById("h-timer"), rem, state.timerTotal, paused);
  var secs = Math.ceil(rem / 1000);
  if (!paused && secs !== tickState.lastSecs) {
    if (secs <= 5 && secs > 0) sfx("tick");
    if (rem <= 0 && !tickState.upPlayed) { tickState.upPlayed = true; sfx("timeup"); hostBroadcast(); }
  }
  tickState.lastSecs = secs;
  if (!paused && rem <= 0 && state.screen === "question" && state.qStage === "steal" && !state.revealed) finishQuestion();
}, 250);

document.addEventListener("visibilitychange", function () {
  if (phoneMode || document.visibilityState !== "visible") return;
  if (net.on && net.status !== "on") hostConnect();
  keepAwake(state.screen !== "setup" || net.on);
});

state = fresh();
state.screen = "setup";
if (phoneMode) startPhone(); else {
  var saved = loadSave();
  if (saved && saved.state.screen !== "setup") {
    // A game was in progress: ask before picking it back up.
    pendingSave = saved;
    state.setupStep = "resume";
  } else if (saved) {
    restoreSave(saved);
  }
  render();
}
</script>
</body>
</html>
