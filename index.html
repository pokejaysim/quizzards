<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzards</title>
<link rel="icon" type="image/svg+xml" href="assets/emblem.svg">
<meta name="description" content="A wizard-themed trivia board game for four houses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--accent:#E2B857;--bg:#14182B;--card:#1E2440;--line:#2E3558;--line2:#3A4266;--chip:#2A3156;--text:#F3EFE6;--muted:#A9AEC4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;background:linear-gradient(rgba(20,24,43,.3),rgba(20,24,43,.3)),url(assets/background.jpg) center bottom/cover no-repeat fixed,var(--bg)}
h1 .emblem{width:52px;height:52px;flex:none}
button{font-family:inherit;cursor:pointer}
#app{max-width:1200px;margin:0 auto;padding:36px 24px 56px;display:flex;flex-direction:column;gap:28px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
h1{display:flex;align-items:center;gap:14px;margin:0;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:44px;line-height:1.1;color:var(--accent)}
.scores{display:flex;flex-wrap:wrap;align-items:stretch;gap:12px}
.score,.wager{display:flex;flex-direction:column;gap:4px;min-width:132px;padding:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bar{height:5px}
.score-name{padding:6px 18px 0;font-size:13px;font-weight:600;color:var(--muted)}
.score-num{padding:0 18px;font-size:30px;font-weight:700}
.btn{min-height:48px;padding:0 22px;border-radius:12px;font-size:16px;font-weight:600;border:1px solid var(--line2);background:var(--chip);color:var(--text)}
.btn.ghost{background:transparent;color:var(--muted);min-height:44px;font-size:14px;align-self:center}
.btn.gold{background:var(--accent);color:var(--bg);border:none;font-weight:700}
.btn.big{min-height:52px;padding:0 28px;font-size:17px;align-self:flex-start}
.btn.center{align-self:center}
.btn.right{align-self:flex-end}
.btn:focus-visible,.tile:focus-visible,.back:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.muted{color:var(--muted);margin:0;font-size:16px}
.small{font-size:14px}
.lead{font-size:17px;line-height:1.5}
.board-intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px}
.board-scroll{overflow-x:auto;padding-bottom:4px}
.board{min-width:760px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.head{display:flex;align-items:center;justify-content:center;min-height:64px;padding:8px 10px;background:#232A4A;border-radius:12px;text-align:center;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:17px;line-height:1.2;color:var(--accent)}
.tile{min-height:48px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:22px;font-weight:700}
.tile:hover{border-color:var(--accent)}
.tile.used{background:#171B30;border:1px dashed var(--line)}
.cleared{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:28px 32px;background:var(--card);border:2px solid var(--accent);border-radius:20px}
.cleared>div{display:flex;flex-direction:column;gap:6px}
.cleared-text{font-size:24px;font-weight:600}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.accent{color:var(--accent)}
.narrow{display:flex;flex-direction:column;gap:20px;width:100%;max-width:900px;margin:0 auto}
.narrow.wide{max-width:960px}
.back{align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;background:transparent;color:var(--muted);border:none;font-size:15px;font-weight:600}
.card{display:flex;flex-direction:column;gap:28px;padding:44px;background:var(--card);border:1px solid var(--line);border-radius:22px}
.card.final{border:2px solid var(--accent)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.meta-right{display:flex;align-items:center;gap:12px}
.chip{padding:6px 14px;background:var(--chip);border-radius:999px;font-size:14px;font-weight:600}
.dots{display:flex;gap:4px}
.dot{width:8px;height:16px;border-radius:3px}
.pts{font-size:18px;font-weight:700;color:var(--accent)}
.question{margin:0;font-size:34px;font-weight:600;line-height:1.3}
.answer{display:flex;flex-direction:column;gap:6px;padding:20px 24px;background:var(--bg);border:1px solid var(--accent);border-radius:16px}
.answer-text{font-size:28px;font-weight:700;color:var(--accent)}
.label{font-size:15px;font-weight:600;color:var(--muted)}
.btn.house{display:flex;align-items:center;gap:10px}
.pip{width:12px;height:12px;border-radius:6px;display:inline-block;flex:none}
.big-pip{width:14px;height:14px;border-radius:7px}
.final-title{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:30px;color:var(--accent)}
.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.wager{background:var(--bg);gap:8px;padding-bottom:18px}
.wager-name{padding:6px 18px 0;font-size:18px;font-weight:700}
.pad{padding:0 18px}
.wager .label{padding-top:6px;font-size:13px}
.wager input{margin:0 18px;min-height:48px;padding:0 14px;background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:20px;font-weight:700}
.judge-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.row-left{display:flex;align-items:center;gap:12px;font-size:18px}
.btn.judge{min-height:44px;font-size:15px}
.btn.right-on{background:#2F7D4F}
.btn.wrong-on{background:#B23A35}
.winner{display:flex;flex-direction:column;gap:8px;text-align:center;padding:12px 0}
.winner-text{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:40px;line-height:1.2;color:var(--accent)}
.rank{display:flex;align-items:center;gap:16px;padding:16px 22px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.place{width:36px;font-size:22px;font-weight:700;color:var(--muted)}
.rank-name{flex:1 1 auto;font-size:20px;font-weight:700}
.rank-score{min-width:56px;text-align:right;font-size:28px;font-weight:700}
.header-btns{display:flex;gap:8px;align-self:center}
.score.is-turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.btn.left{align-self:flex-start}
.name-row{display:flex;gap:10px;flex-wrap:wrap}
.name-row input{flex:1 1 240px;min-height:48px;padding:0 14px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:10px;font-family:inherit;font-size:17px}
.name-row input::placeholder{color:#8A90A8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.name-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 14px;background:var(--chip);border-radius:999px;font-size:15px;font-weight:600}
.chip-x{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;background:transparent;border:none;color:var(--muted)}
.chip-x:hover{color:var(--text);background:#343B5E}
.hat-card{align-items:center;text-align:center;padding:56px 32px}
.hat-name{font-size:40px;font-weight:700}
.hat-thinking{font-size:24px;font-style:italic;color:var(--muted);min-height:64px;display:flex;align-items:center;animation:pulse 1s ease-in-out infinite alternate}
.hat-house{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:56px;min-height:64px;letter-spacing:.04em;animation:pop .35s ease-out}
.center-row{justify-content:center}
.rosters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.roster{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.roster-name{padding:12px 18px 4px;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:22px}
.roster ul{margin:0;padding:4px 18px 18px 36px;display:flex;flex-direction:column;gap:4px;font-size:17px}
.turn-banner{display:flex;align-items:center;gap:14px;padding:16px 22px;background:var(--card);border:2px solid;border-radius:16px}
.turn-text{display:flex;flex-direction:column;gap:2px}
.turn-name{font-size:22px;font-weight:700}
.btn.picker{border-color:var(--accent)}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.hat-thinking,.hat-house{animation:none}}
.music-btn{display:inline-flex;align-items:center;gap:8px}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60;display:none}
.splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--house) 28%,transparent),transparent 62%),rgba(10,12,24,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadein .4s ease-out}
.splash-title.tie{font-size:52px}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:720px}
.trophy{width:120px;height:120px;animation:rise .7s cubic-bezier(.2,1.4,.4,1) both}
.splash-title{margin:0;font-family:Cinzel,Georgia,serif;font-weight:700;font-size:72px;line-height:1.05;letter-spacing:.02em;animation:pop .6s .2s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 0 40px color-mix(in srgb,var(--house) 55%,transparent)}
.splash-score{font-size:28px;font-weight:700;color:var(--accent)}
.splash .btn{margin-top:12px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.splash,.trophy,.splash-title{animation:none}}
.join-off{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.join-panel{display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:20px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.qr{width:168px;height:168px;flex:none;background:#fff;border-radius:12px;overflow:hidden}
.qr svg{display:block;width:100%;height:100%}
.join-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.join-url{font-size:15px;color:var(--muted);word-break:break-all}
.join-url strong{color:var(--text)}
.join-code{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:56px;letter-spacing:.14em;line-height:1.1;color:var(--accent)}
.buzz-banner{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 20px;background:var(--bg);border:2px solid;border-radius:16px;animation:pop .3s ease-out}
.buzz-banner .turn-text{flex:1 1 auto}
body.phone #app{max-width:520px;padding:20px 16px 40px;gap:16px}
.p-top{display:flex;justify-content:space-between;align-items:center}
.p-brand{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:24px;color:var(--accent)}
.p-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 20px;background:var(--card);border:1px solid var(--line);border-radius:20px}
.p-card .label{align-self:flex-start}
.p-card input{width:100%;min-height:52px;padding:0 14px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:12px;font-family:inherit;font-size:18px}
.p-wide{align-self:stretch;width:100%}
.p-big{margin:0;font-size:24px;font-weight:700;line-height:1.3}
.p-house{display:flex;flex-direction:column;gap:2px;align-items:center;padding:22px 16px;border-radius:20px;color:#14182B}
.p-house-name{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:34px}
.p-house-sub{font-size:15px;font-weight:600}
.buzzer{width:min(72vw,280px);height:min(72vw,280px);border-radius:50%;border:6px solid rgba(255,255,255,.35);color:#14182B;font-size:28px;font-weight:700;box-shadow:0 10px 0 rgba(0,0,0,.35);touch-action:manipulation}
.buzzer:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
@media (max-width:640px){h1{font-size:34px}.splash-title{font-size:44px}.splash-title.tie{font-size:34px}h1 .emblem{width:40px;height:40px}.card{padding:24px}.question{font-size:26px}.winner-text{font-size:30px}.hat-house{font-size:40px}.hat-name{font-size:30px}.rank{flex-wrap:wrap}}
</style>
</head>
<body>
<main id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
// Question library: each category has 10 levels (1 = easiest, 10 = hardest),

var CATS = [
  { name: "Spells", qs: [
    [["What spell lights up the tip of your wand?", "Lumos"],
     ["What spell puts out the light from a wand?", "Nox"],
     ["What incantation casts the Patronus Charm?", "Expecto Patronum"]],

    [["What spell unlocks doors?", "Alohomora"],

    [["What disarming spell became Harry's signature move?", "Expelliarmus"],

    [["What spell does Harry use to call his Firebolt to him during the first Triwizard task?", "Accio"],

    [["What spell does Hermione use to freeze Neville stiff in first year?", "Petrificus Totalus (the Full Body-Bind)"],
     ["What spell does Draco use at the Duelling Club to make Harry's legs dance?", "Tarantallegra"],

    [["What form does Hermione's Patronus take?", "An otter"],
     ["What form does Ron's Patronus take?", "A Jack Russell terrier"],
     ["What form does Snape's Patronus take?", "A doe"]],
    [["What spell conjures the Dark Mark into the sky?", "Morsmordre"],
     ["What Half-Blood Prince spell glues a person's tongue to the roof of their mouth?", "Langlock"],
     ["What does Hermione's jinx on the DA sign-up sheet do to whoever betrays the group?", "Spells out SNEAK in pimples across their face"]],
    [["What slashing curse did the Half-Blood Prince invent?", "Sectumsempra"],
     ["What charm does Hermione put on the fake Galleons the DA uses to send meeting times?", "The Protean Charm"],
     ["What spell does Hermione use to try to reveal the Half-Blood Prince's secrets in his book?", "Specialis Revelio"]],
    [["What spell does Amos Diggory use on Harry's wand at the World Cup to reveal the last spell it cast?", "Prior Incantato"],

  ]},
  { name: "Hogwarts", qs: [
    [["Which house is Harry sorted into?", "Gryffindor"],
     ["Who is the headmaster of Hogwarts for most of the series?", "Albus Dumbledore"],
     ["How many houses are there at Hogwarts?", "Four"]],
    [["What platform does the Hogwarts Express leave from?", "Platform 9¾"],
     ["Which house is Draco Malfoy in?", "Slytherin"],
     ["What animal represents Hufflepuff?", "A badger"]],
    [["What object decides which house new students join?", "The Sorting Hat"],
     ["Which house is represented by an eagle?", "Ravenclaw"],
     ["What is the woods next to Hogwarts called?", "The Forbidden Forest"]],
    [["What village near Hogwarts can students visit starting in third year?", "Hogsmeade"],
     ["What tree attacks Harry and Ron's flying car?", "The Whomping Willow"],
     ["What is the name of the poltergeist who causes trouble at Hogwarts?", "Peeves"]],
    [["What is the name of Gryffindor's house ghost?", "Nearly Headless Nick"],
     ["Who is head of Gryffindor house?", "Professor Minerva McGonagall"],
     ["What is the name of the joke shop in Hogsmeade?", "Zonko's"]],
    [["Which seventh-floor room opens when you walk past it three times thinking of what you need?", "The Room of Requirement"],
     ["Which ghost haunts the girls' bathroom on the second floor?", "Moaning Myrtle"],
     ["What is the name of the sweet shop in Hogsmeade?", "Honeydukes"]],
    [["What are the names of the Hogwarts caretaker and his cat?", "Argus Filch and Mrs Norris"],
     ["What is the name of Slytherin's house ghost?", "The Bloody Baron"],
     ["Who is head of Hufflepuff house?", "Professor Pomona Sprout"]],
    [["Which part of the castle is the Hufflepuff common room entrance near?", "The kitchens"],
     ["To get into the Hogwarts kitchens, what do you tickle?", "The pear in the painting of a bowl of fruit"],
     ["Where is the Slytherin common room?", "In the dungeons, under the lake"]],
    [["Instead of a password, what must you do to get into Ravenclaw Tower?", "Answer a riddle"],
     ["What is the name of Ravenclaw's house ghost?", "The Grey Lady"],
     ["Name all four founders of Hogwarts.", "Godric Gryffindor, Helga Hufflepuff, Rowena Ravenclaw and Salazar Slytherin"]],
    [["What is the Hogwarts school motto?", "Draco dormiens nunquam titillandus (Never tickle a sleeping dragon)"],
     ["What is the name of Hufflepuff's house ghost?", "The Fat Friar"],
     ["Which statue hides the secret passage to the Honeydukes cellar?", "The one-eyed witch"]]
  ]},
  { name: "Characters", qs: [
    [["Who are Harry's two best friends?", "Ron Weasley and Hermione Granger"],
     ["Who is the half-giant gamekeeper at Hogwarts?", "Hagrid"],
     ["What is the name of Harry's cousin?", "Dudley Dursley"]],
    [["What is Lord Voldemort's real name?", "Tom Marvolo Riddle"],

     ["Who is Harry's main rival from Slytherin?", "Draco Malfoy"]],
    [["What house-elf does Harry free by tricking Lucius Malfoy into giving him a sock?", "Dobby"],

    [["Who is Harry's godfather?", "Sirius Black"],

     ["Which Gryffindor boy keeps losing his toad, Trevor?", "Neville Longbottom"]],
    [["What is Hagrid's first name?", "Rubeus"],
     ["Which Ravenclaw girl, nicknamed \"Loony,\" wears radish earrings?", "Luna Lovegood"],
     ["What is Professor McGonagall's first name?", "Minerva"]],
    [["Which werewolf teaches Defence Against the Dark Arts in Harry's third year?", "Remus Lupin"],
     ["Who betrayed Harry's parents to Voldemort?", "Peter Pettigrew"],
     ["Who does Harry take to the Yule Ball?", "Parvati Patil"]],
    [["Who turns out to be the Half-Blood Prince?", "Severus Snape"],
     ["Who is Harry's first crush, the Ravenclaw Seeker?", "Cho Chang"],
     ["Which Death Eater is Sirius Black's cousin?", "Bellatrix Lestrange"]],
    [["Who spends Harry's fourth year disguised as Mad-Eye Moody?", "Barty Crouch Jr."],
     ["What is the name of the Black family's house-elf?", "Kreacher"],
     ["What is Hermione's middle name?", "Jean"]],
    [["What is the name of Dumbledore's brother, and which pub does he run?", "Aberforth Dumbledore, the Hog's Head"],
     ["What is the name of Hagrid's giant half-brother?", "Grawp"],
     ["What is Luna's father's name, and what magazine does he run?", "Xenophilius Lovegood, The Quibbler"]],
    [["What are Dumbledore's three middle names?", "Percival Wulfric Brian"],
     ["What was Snape's mother's maiden name?", "Prince (Eileen Prince)"],
     ["What was the name of Voldemort's mother?", "Merope Gaunt"]]
  ]},
  { name: "Magical Creatures", qs: [
    [["What kind of bird is Hedwig?", "A snowy owl"],
     ["What kind of creature is Dobby?", "A house-elf"],
     ["What kind of animal is Hagrid's pet Fang?", "A dog (a boarhound)"]],
    [["What kind of animal is Ron's pet Scabbers?", "A rat"],
     ["What is the name of Neville's toad?", "Trevor"],
     ["What creatures guard the wizard prison Azkaban?", "Dementors"]],
    [["What makes Fluffy the three-headed dog fall asleep?", "Music"],
     ["What creatures run Gringotts bank?", "Goblins"],
     ["What animal is Harry's Patronus?", "A stag"]],
    [["What kind of creature is Buckbeak?", "A hippogriff"],
     ["What huge creature with tentacles lives in the Black Lake?", "The giant squid"],
     ["What blue creatures does Lockhart release in his first lesson?", "Cornish pixies"]],
    [["What kind of bird is Fawkes?", "A phoenix"],
     ["What giant serpent lives in the Chamber of Secrets?", "A basilisk"],
     ["What creatures live in the Black Lake and guard the hostages in the second task?", "Merpeople"]],
    [["What does Hagrid name the baby dragon he hatches in first year?", "Norbert"],
     ["What is the name of Ron's tiny owl?", "Pigwidgeon"],
     ["What creature's blood keeps Voldemort alive in the Forbidden Forest?", "A unicorn's"]],
    [["What is the name of the giant spider Hagrid raised?", "Aragog"],
     ["What creatures does Hagrid breed in fourth year that sting and explode?", "Blast-Ended Skrewts"],
     ["What kind of creature is Firenze?", "A centaur"]],
    [["Which breed of dragon does Harry face in the first Triwizard task?", "A Hungarian Horntail"],
     ["What water demons grab at Harry during the second task?", "Grindylows"],
     ["What creature asks Harry a riddle in the Triwizard maze?", "A sphinx"]],
    [["What creatures pull the Hogwarts carriages, visible only to those who have seen death?", "Thestrals"],
     ["What new name does Hagrid give Buckbeak to hide him?", "Witherwings"],

// Pick a random index from a pool of n, preferring ones not seen yet.
// When every question in the pool has been seen, that pool starts over.
function pickUnseen(n, prefix, seen) {
  var open = [];
  for (var i = 0; i < n; i++) if (!seen[prefix + i]) open.push(i);
  if (open.length === 0) {
    for (var k = 0; k < n; k++) delete seen[prefix + k];
    for (var j = 0; j < n; j++) open.push(j);
  }
  return open[Math.floor(Math.random() * open.length)];
}

    var j = Math.floor(Math.random() * (i + 1));

}

var MUSIC_KEY = "quizzards-music-v1";
var audio = { ctx: null, master: null, on: false, timer: null, nextTime: 0, step: 0 };
var wantMusic = (function () { try { return window.localStorage.getItem(MUSIC_KEY) === "on"; } catch (e) { return false; } })();

function audioInit() {
  if (audio.ctx) return true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  var ctx = new AC();
  var master = ctx.createGain();
  master.gain.value = 0;
  // A soft echo gives the music-box notes a dreamy tail.
  var delay = ctx.createDelay();
  delay.delayTime.value = 0.36;
  var feedback = ctx.createGain();
  feedback.gain.value = 0.32;
  var wet = ctx.createGain();
  wet.gain.value = 0.28;
  master.connect(ctx.destination);
  master.connect(delay);
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(wet);
  wet.connect(ctx.destination);
  audio.ctx = ctx;
  audio.master = master;
  return true;
}

function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function tone(midi, when, dur, type, vol, dest) {
  var ctx = audio.ctx;
  var osc = ctx.createOscillator();
  var g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = midiHz(midi);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(g);
  g.connect(dest || audio.master);
  osc.start(when);
  osc.stop(when + dur + 0.05);
}

// An original waltz-time loop: D minor, B-flat, G minor, A.
var CHORDS = [
  { bass: 38, arp: [62, 69, 74, 77, 74, 69] },
  { bass: 34, arp: [58, 65, 70, 74, 70, 65] },
  { bass: 43, arp: [55, 62, 67, 70, 67, 62] },
  { bass: 45, arp: [57, 64, 69, 73, 69, 64] }
];
var EIGHTH = 0.3;

function scheduleMusic() {
  var ctx = audio.ctx;
  while (audio.nextTime < ctx.currentTime + 0.4) {
    var bar = Math.floor(audio.step / 6) % CHORDS.length;
    var pos = audio.step % 6;
    var chord = CHORDS[bar];
    var t = audio.nextTime;
    tone(chord.arp[pos], t, 1.1, "triangle", 0.22);
    if (pos === 0) tone(chord.bass, t, EIGHTH * 6, "sine", 0.25);
    if (pos === 3 && Math.floor(audio.step / 6) % 2 === 1) tone(chord.arp[3] + 12, t + EIGHTH / 2, 1.4, "sine", 0.08);
    audio.nextTime += EIGHTH;
    audio.step++;
  }
}

function startMusic() {
  if (!audioInit()) return;
  audio.ctx.resume();
  if (audio.on) return;
  audio.on = true;
  audio.nextTime = audio.ctx.currentTime + 0.1;
  audio.step = 0;
  audio.master.gain.cancelScheduledValues(audio.ctx.currentTime);
  audio.master.gain.setTargetAtTime(0.16, audio.ctx.currentTime, 0.6);
  audio.timer = setInterval(scheduleMusic, 100);
  scheduleMusic();
}

function stopMusic() {
  if (!audio.on) return;
  audio.on = false;
  clearInterval(audio.timer);
  audio.master.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.25);
}

// A short triumphant flourish for the winner. Plays when sound is on.
function playFanfare() {
  if (!wantMusic || !audioInit()) return;
  var ctx = audio.ctx;
  ctx.resume();
  var out = ctx.createGain();
  out.gain.value = 0.5;
  var filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 2400;
  out.connect(filter);
  filter.connect(ctx.destination);
  var t = ctx.currentTime + 0.05;
  [[62, 0, 0.18], [66, 0.18, 0.18], [69, 0.36, 0.18], [74, 0.54, 1.6]].forEach(function (n) {
    tone(n[0], t + n[1], n[2] + 0.25, "sawtooth", 0.09, out);
    tone(n[0] - 12, t + n[1], n[2] + 0.25, "triangle", 0.12, out);
  });
  [62, 66, 69, 74, 78].forEach(function (m) { tone(m, t + 0.54, 2.2, "triangle", 0.07, out); });
}

// ---------- Confetti for the winner ----------
var confetti = { raf: null, parts: [] };
function startConfetti(colors) {
  stopConfetti();
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv = document.getElementById("confetti");
  if (!cv || !cv.getContext) return;
  var dpr = window.devicePixelRatio || 1;
  cv.width = window.innerWidth * dpr;
  cv.height = window.innerHeight * dpr;
  cv.style.display = "block";
  var c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = window.innerWidth, H = window.innerHeight;
  var palette = colors.concat(["#E2B857", "#F3EFE6"]);
  confetti.parts = [];
  for (var i = 0; i < 180; i++) {
    confetti.parts.push({
      x: Math.random() * W, y: -20 - Math.random() * H,
      vx: (Math.random() - 0.5) * 1.6, vy: 1.5 + Math.random() * 2.5,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
      color: palette[Math.floor(Math.random() * palette.length)]
    });
  }
  var start = performance.now();
  function frame(now) {
    var elapsed = (now - start) / 1000;
    c.clearRect(0, 0, W, H);
    var alive = 0;
    confetti.parts.forEach(function (p) {
      p.x += p.vx + Math.sin(now / 600 + p.r) * 0.4;
      p.y += p.vy;
      p.r += p.vr;
      if (p.y > H + 20 && elapsed < 5) { p.y = -20; p.x = Math.random() * W; }
      if (p.y <= H + 20) {
        alive++;
        c.save();
        c.translate(p.x, p.y);
        c.rotate(p.r);
        c.fillStyle = p.color;
        c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
        c.restore();
      }
    });
    if (alive > 0) confetti.raf = requestAnimationFrame(frame); else stopConfetti();
  }
  confetti.raf = requestAnimationFrame(frame);
}
function stopConfetti() {
  if (confetti.raf) cancelAnimationFrame(confetti.raf);
  confetti.raf = null;
  var cv = document.getElementById("confetti");
  if (cv) { cv.style.display = "none"; var c = cv.getContext && cv.getContext("2d"); if (c) c.clearRect(0, 0, cv.width, cv.height); }
}

    var id = p.id.slice(0, 40);
    if (net.ids[id] || Object.keys(net.ids).length >= 60) { hostBroadcast(); return; }
    var name = p.name.replace(/\s+/g, " ").trim().slice(0, 24);
    if (!name) return;
    name = uniqueName(name);
    net.ids[id] = name;
    teams.players.push(name);
    savePlayers(teams.players);
    if (teams.sorted) {
      // Late joiner: put them in the smallest house that's already playing.
      var smallest = teams.active.slice().sort(function (a, b) { return membersOf(a).length - membersOf(b).length; })[0];
      teams.sorted.push({ name: name, house: smallest });
    }
    renderKeepingInput();
    return;
  }
  if (p.t === "buzz" && typeof p.id === "string") {
    var who = net.ids[p.id];
    var h = who ? houseOfName(who) : null;
    if (!h || net.buzz || state.screen !== "question" || state.revealed) return;
    if (h.house === turnHouse()) return;
    net.buzz = { id: p.id, name: who, house: h.house };
    if (wantMusic && audioInit()) { audio.ctx.resume(); tone(81, audio.ctx.currentTime + 0.01, 0.35, "square", 0.12, audio.ctx.destination); }
    render();
  }
}

function forgetPhoneName(name) {
  Object.keys(net.ids).forEach(function (id) { if (net.ids[id] === name) delete net.ids[id]; });
}

function makeQr(url) {
  var need = window.qrcode ? Promise.resolve() : loadScript("assets/qrcode.js");
  return need.then(function () {
    var qr = window.qrcode(0, "M");
    qr.addData(url);
    qr.make();
    return qr.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
  });
}

function joinUrl() {
  return window.location.origin + window.location.pathname + "?room=" + net.code;
}

function enablePhones() {
  if (net.on) return;
  var letters = "BCDFGHJKLMNPQRSTVWXZ";
  var code = "";
  for (var i = 0; i < 4; i++) code += letters[Math.floor(Math.random() * letters.length)];
  net.on = true;
  net.code = code;
  net.status = "connecting";
  render();
  makeQr(joinUrl()).then(function (svg) { net.qr = svg; renderKeepingInput(); }).catch(function () {});
  openChannel(code, hostOnMsg, function (st) {
    var was = net.status;
    net.status = st;
    if (st === "on") hostBroadcast();
    if (st !== was) renderKeepingInput();
  }).then(function (ch) {
    net.channel = ch;
    net.beat = setInterval(hostBroadcast, 4000);
  }).catch(function () { net.status = "error"; renderKeepingInput(); });
}

function viewJoinPanel() {
  if (!net.on) {
    return '<div class="join-off"><button class="btn" data-action="enablePhones">Let players join by phone</button>' +
      '<span class="muted small">Shows a QR code. Phones become buzzers. Needs internet.</span></div>';
  }
  var status = net.status === "on" ? "Ready for players" : net.status === "error" ? "Couldn’t connect. Check the internet and reload." : "Connecting…";
  var phones = Object.keys(net.ids).length;
  return '<div class="join-panel">' +
    '<div class="qr" role="img" aria-label="QR code to join the game">' + (net.qr || "") + '</div>' +
    '<div class="join-text"><span class="eyebrow accent">Join on your phone</span>' +
    '<span class="muted">Scan the code, or open this page and add</span>' +
    '<span class="join-url">?room=<strong>' + net.code + '</strong></span>' +
    '<span class="join-code" aria-label="Room code ' + net.code.split("").join(" ") + '">' + net.code + '</span>' +
    '<span class="muted small">' + status + (phones ? ' · ' + phones + (phones === 1 ? ' phone' : ' phones') + ' joined' : '') + '</span></div></div>';
}

function viewBuzzBanner() {
  if (!net.on || !Object.keys(net.ids).length) return "";
  if (net.buzz) {
    var h = HOUSES[net.buzz.house];
    return '<div class="buzz-banner" style="border-color:' + h.color + '"><span class="pip big-pip" style="background:' + h.color + '"></span>' +
      '<div class="turn-text"><span class="turn-name">' + h.name + ' buzzed to steal!</span><span class="muted small">' + esc(net.buzz.name) + ' was first</span></div>' +
      (state.revealed ? '' : '<button class="btn ghost" data-action="clearBuzz">Clear buzz</button>') + '</div>';
  }
  return state.revealed ? "" : '<p class="muted small">Buzzers are open for the other houses.</p>';
}

// ----- Phone side -----
var ph = { id: "", name: "", channel: null, status: "connecting", st: null, lastSeen: 0, wantJoin: false, html: "", buzzed: false };

function phoneMe() {
  if (!ph.st) return null;
  for (var i = 0; i < ph.st.players.length; i++) if (ph.st.players[i].id === ph.id) return ph.st.players[i];
  return null;
}

function phoneJoin(name) {
  name = String(name || "").replace(/\s+/g, " ").trim().slice(0, 24);
  if (!name) return;
  ph.name = name;
  ph.wantJoin = true;
  try { window.localStorage.setItem("quizzards-phone-name", name); } catch (e) {}
  netSend(ph.channel, { t: "join", id: ph.id, name: name });
  renderPhone();
}

function phoneBuzz() {
  ph.buzzed = true;
  ph.buzzAt = Date.now();
  netSend(ph.channel, { t: "buzz", id: ph.id });
  try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  renderPhone();
}

function phoneView() {
  var head = '<header class="p-top"><span class="p-brand">Quizzards</span><span class="chip">Room ' + ROOM + '</span></header>';
  var st = ph.st;
  var stale = st && Date.now() - ph.lastSeen > 13000;
  if (ph.status === "error") return head + '<div class="p-card"><p class="p-big">Couldn’t connect</p><p class="muted">Check your internet, then reload this page.</p></div>';
  if (!st || stale) return head + '<div class="p-card"><p class="p-big">Looking for the game…</p><p class="muted">Make sure the room code matches the big screen.</p></div>';
  var me = phoneMe();
  if (!me) {
    if (ph.wantJoin) return head + '<div class="p-card"><p class="p-big">Joining…</p></div>';
    return head + '<form class="p-card" id="p-join"><label class="label" for="p-name">Your name</label>' +
      '<input id="p-name" type="text" maxlength="24" autocomplete="off" value="' + esc(ph.name) + '">' +
      '<button class="btn gold big p-wide" type="submit">Join the game</button></form>';
  }
  if (me.house === null) {
    var waitMsg = st.phase === "sorting" ? "The Sorting Hat is thinking…" : "You’re in, " + esc(me.name) + "!";
    return head + '<div class="p-card"><p class="p-big">' + waitMsg + '</p><p class="muted">Watch the big screen.</p></div>';
  }
  var h = HOUSES[me.house];
  var badge = '<div class="p-house" style="background:' + h.color + '"><span class="p-house-name">' + h.name + '</span>' +
    '<span class="p-house-sub">' + esc(me.name) + ' · ' + st.scores[me.house] + ' points</span></div>';
  var body;
  var myTurn = st.turn === me.house;
  if (st.phase === "sorting" || st.phase === "rosters" || st.phase === "lobby") {
    body = '<p class="p-big">Welcome to ' + h.name + '!</p><p class="muted">Find your housemates and get ready.</p>';
  } else if (st.phase === "board") {
    body = myTurn ? '<p class="p-big">Your house picks next!</p><p class="muted">Choose a category and points, and tell the host.</p>'
      : '<p class="p-big">' + HOUSES[st.turn].name + ' is picking…</p>';
  } else if (st.phase === "question") {
    if (st.buzz) {
      body = st.buzz.id === ph.id ? '<p class="p-big">You buzzed first! Give your answer.</p>'
        : st.buzz.house === me.house ? '<p class="p-big">' + esc(st.buzz.name) + ' buzzed for your house!</p>'
        : '<p class="p-big">' + HOUSES[st.buzz.house].name + ' buzzed first.</p>';
    } else if (myTurn) {
      body = '<p class="p-big">Your house answers first.</p><p class="muted">Talk it over and tell the host your answer.</p>';
    } else {
      body = '<button class="buzzer" id="p-buzz" style="background:' + h.color + '">' + (ph.buzzed ? 'Buzzed…' : 'Buzz to steal') + '</button>' +
        '<p class="muted">Think ' + HOUSES[st.turn].name + ' will miss? Buzz in.</p>';
    }
  } else if (st.phase === "revealed") {
    body = '<p class="p-big">The answer is on the big screen.</p>';
  } else if (st.phase === "final") {
    body = '<p class="p-big">Final question!</p><p class="muted">Agree on a wager and an answer with your house.</p>';
  } else {
    var won = st.winners && st.winners.indexOf(me.house) >= 0;
    body = won ? '<p class="p-big">' + h.name + ' wins the House Cup!</p>' : '<p class="p-big">Game over. Thanks for playing!</p>';
  }
  return head + badge + '<div class="p-card">' + body + '</div>';
}

function renderPhone() {
  var html = phoneView();
  if (html === ph.html) return;
  ph.html = html;
  document.getElementById("app").innerHTML = html;
}

function startPhone() {
  document.body.classList.add("phone");
  try {
    ph.id = window.localStorage.getItem("quizzards-phone-id") || "";
    ph.name = window.localStorage.getItem("quizzards-phone-name") || "";
  } catch (e) {}
  if (!ph.id) {
    ph.id = "p" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { window.localStorage.setItem("quizzards-phone-id", ph.id); } catch (e) {}
  }
  renderPhone();
  openChannel(ROOM, function (p) {
    if (p.t !== "state" || !Array.isArray(p.players)) return;
    var hadBuzz = !!(ph.st && ph.st.buzz);
    ph.st = p;
    ph.lastSeen = Date.now();
    if (phoneMe()) ph.wantJoin = false;
    if (p.phase !== "question" || (hadBuzz && !p.buzz)) ph.buzzed = false;
    renderPhone();
  }, function (st) {
    ph.status = st;
    if (st === "on") netSend(ph.channel, { t: "hello", id: ph.id });
    renderPhone();
  }).then(function (ch) {
    ph.channel = ch;
    if (ph.status === "on") netSend(ch, { t: "hello", id: ph.id });
  }).catch(function () { ph.status = "error"; renderPhone(); });
  setInterval(function () {
    if (ph.status === "on" && (!ph.st || Date.now() - ph.lastSeen > 8000)) netSend(ph.channel, { t: "hello", id: ph.id });
    if (ph.buzzed && ph.st && !ph.st.buzz && Date.now() - ph.buzzAt > 2500) ph.buzzed = false;
    if (ph.wantJoin && ph.st && !phoneMe()) netSend(ph.channel, { t: "join", id: ph.id, name: ph.name });
    renderPhone();
  }, 3000);
  document.addEventListener("submit", function (e) {
    if (e.target.id === "p-join") { e.preventDefault(); phoneJoin(document.getElementById("p-name").value); }
  });
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("#p-buzz") && !ph.buzzed) phoneBuzz();
  });
}

// ---------- Actions ----------
var actions = {
  addName: function () { addNameFromInput(); },
  removeName: function (el) {
    forgetPhoneName(teams.players[+el.dataset.i]);
    teams.players.splice(+el.dataset.i, 1);
    savePlayers(teams.players);
    render();
  },
  enablePhones: function () { enablePhones(); },
  clearBuzz: function () { net.buzz = null; render(); },
  clearNames: function () { net.ids = {}; teams.players = []; savePlayers(teams.players); render(); },
  sortPlayers: function () {
    if (!teams.players.length) return;
    var names = shuffle(teams.players);
    var order = shuffle([0, 1, 2, 3]);
    teams.sorted = names.map(function (n, i) { return { name: n, house: order[i % 4] }; });
    teams.active = [0, 1, 2, 3].filter(function (h) { return membersOf(h).length > 0; });
    setState({ setupStep: "reveal", revealIdx: 0 });
    hatThink();
  },
  nextReveal: function () {
    if (state.revealIdx < teams.sorted.length - 1) {
      setState({ revealIdx: state.revealIdx + 1 });
      hatThink();
    } else {
      setState({ setupStep: "rosters", thinking: false });
    }
  },
  skipReveal: function () { clearTimeout(hatTimer); setState({ setupStep: "rosters", thinking: false }); },
  skipSorting: function () {
    teams.sorted = null;
    teams.active = [0, 1, 2, 3];
    state = fresh();
    render();
  },
  startGame: function () { state = fresh(); render(); },
  players: function () { setState({ screen: "setup", setupStep: "names" }); },
  reset: function () { state = fresh(); render(); },
  pick: function (el) { net.buzz = null; setState({ screen: "question", cat: +el.dataset.cat, v: +el.dataset.v, revealed: false }); },
  reveal: function () { setState({ revealed: true }); },
  back: function () { net.buzz = null; setState({ screen: "board", revealed: false }); },
  award: function (el) {
    var team = +el.dataset.team;
    var scores = state.scores.slice();
    if (team >= 0) scores[team] += state.v;
    var used = Object.assign({}, state.used);
    used[state.cat + "-" + state.v] = true;
    markSeen(state.cat + "-" + (state.v - 1) + "-" + state.deal[state.cat][state.v - 1]);
    net.buzz = null;
    setState({ scores: scores, used: used, screen: "board", revealed: false, turn: (state.turn + 1) % teams.active.length });
  },
  startFinal: function () { setState({ screen: "final", finalStep: "wager", wagers: ["", "", "", ""], judged: [null, null, null, null] }); },
  lockWagers: function () {
    var w = state.wagers.map(function (raw, i) {
      var n = parseInt(raw, 10);
      if (isNaN(n)) n = 0;
      return String(Math.min(Math.max(n, 0), maxWager(i)));
    });
    setState({ wagers: w, finalStep: "question" });
  },
  revealFinal: function () { markSeen("F-" + state.finalIdx); setState({ finalStep: "judge" }); },
  judge: function (el) {
    var a = state.judged.slice();
    a[+el.dataset.house] = el.dataset.right === "1";
    setState({ judged: a });
  },
  finishFinal: function () {
    var next = state.scores.map(function (sc, i) {
      if (teams.active.indexOf(i) < 0) return sc;
      var w = parseInt(state.wagers[i], 10) || 0;
      return state.judged[i] ? sc + w : sc - w;
    });
    setState({ before: state.scores.slice(), scores: next, finalStep: "results", splash: true });
    startConfetti(winners().map(function (i) { return HOUSES[i].color; }));
    playFanfare();
  },
  closeSplash: function () { stopConfetti(); setState({ splash: false }); },
  toggleMusic: function () { toggleMusic(); }
};

// ---------- Views ----------
function viewHeader() {
  var playing = state.screen !== "setup";
  var cards = playing ? teams.active.map(function (i) {
    var h = HOUSES[i];
    var isTurn = state.screen === "board" && i === turnHouse();
    return '<div class="score' + (isTurn ? ' is-turn' : '') + '"><span class="bar" style="background:' + h.color + '"></span>' +
      '<span class="score-name">' + h.name + '</span><span class="score-num">' + state.scores[i] + '</span></div>';
  }).join("") : "";
  var buttons = playing
    ? '<div class="header-btns">' + musicButton() + '<button class="btn ghost" data-action="players">Players</button><button class="btn ghost" data-action="reset">New game</button></div>'
    : '<div class="header-btns">' + musicButton() + '</div>';
  return '<header class="top"><h1><img class="emblem" src="assets/emblem.svg" alt="">Quizzards</h1><div class="scores">' + cards + buttons + '</div></header>';
}

function viewSetup() {
  if (state.setupStep === "names") {
    var chips = teams.players.map(function (n, i) {
      return '<span class="name-chip">' + esc(n) + '<button class="chip-x" data-action="removeName" data-i="' + i + '" aria-label="Remove ' + esc(n) + '">' +
        '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>';
    }).join("");
    var count = teams.players.length;
    return '<section class="narrow"><div class="card">' +
      '<div class="stack-sm"><span class="final-title">The Sorting Ceremony</span>' +
      '<p class="muted lead">Add every player, then let the Sorting Hat put everyone into a house. Houses are kept as even as possible. With fewer than four players, only the houses that get someone will play.</p></div>' +
      '<div class="stack-sm"><label class="label" for="name-input">Player name</label>' +
      '<div class="name-row"><input id="name-input" type="text" maxlength="200" autocomplete="off" placeholder="Type a name and press Enter">' +
      '<button class="btn" data-action="addName">Add</button></div>' +
      '<span class="muted small">Tip: paste several names at once, separated by commas.</span></div>' +
      viewJoinPanel() +
      (count ? '<div class="stack-sm"><span class="label">' + count + (count === 1 ? ' player' : ' players') + '</span><div class="chips">' + chips + '</div>' +
        '<button class="btn ghost left" data-action="clearNames">Clear all</button></div>' : '') +
      '<div class="row">' +
      (count ? '<button class="btn gold big" data-action="sortPlayers">Sort everyone</button>' : '') +
      '<button class="btn ghost" data-action="skipSorting">Skip, we already have teams</button></div>' +
      '</div></section>';
  }
  if (state.setupStep === "reveal") {
    var p = teams.sorted[state.revealIdx];
    var total = teams.sorted.length;
    var last = state.revealIdx === total - 1;
    var result = state.thinking
      ? '<span class="hat-thinking">Hmm, difficult. Very difficult…</span>'
      : '<span class="hat-house" style="color:' + HOUSES[p.house].color + '">' + HOUSES[p.house].name.toUpperCase() + '!</span>';
    return '<section class="narrow"><div class="card hat-card">' +
      '<span class="eyebrow">Player ' + (state.revealIdx + 1) + ' of ' + total + '</span>' +
      '<span class="hat-name">' + esc(p.name) + '</span>' + result +
      '<div class="row center-row">' +
      (state.thinking ? '' : '<button class="btn gold big" data-action="nextReveal">' + (last ? 'See the houses' : 'Next player') + '</button>') +
      '<button class="btn ghost" data-action="skipReveal">Skip to the results</button></div>' +
      '</div></section>';
  }
  var cols = teams.active.map(function (h) {
    var names = membersOf(h).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join("");
    return '<div class="roster"><span class="bar" style="background:' + HOUSES[h].color + '"></span>' +
      '<span class="roster-name">' + HOUSES[h].name + '</span><ul>' + names + '</ul></div>';
  }).join("");
  return '<section class="stack"><div class="stack-sm"><span class="final-title">Your houses</span>' +
    '<p class="muted">Sit with your house. Each house takes turns picking from the board.</p></div>' +
    '<div class="rosters">' + cols + '</div>' +
    '<div class="row"><button class="btn gold big" data-action="startGame">Start the game</button>' +
    '<button class="btn ghost" data-action="sortPlayers">Sort again</button>' +
    '<button class="btn ghost" data-action="players">Edit players</button></div></section>';
}

function viewTurnBanner() {
  var h = turnHouse();
  var members = membersOf(h);
  return '<div class="turn-banner" style="border-color:' + HOUSES[h].color + '"><span class="pip big-pip" style="background:' + HOUSES[h].color + '"></span>' +
    '<div class="turn-text"><span class="turn-name">' + HOUSES[h].name + '’s turn to pick</span>' +
    (members.length ? '<span class="muted small">' + members.map(esc).join(", ") + '</span>' : '') +
    '</div></div>';
}

function viewBoard() {
  var heads = CATS.map(function (c) { return '<div class="head">' + esc(c.name) + '</div>'; }).join("");
  var tiles = "";
  for (var v = 1; v <= 10; v++) {
    for (var ci = 0; ci < CATS.length; ci++) {
      if (state.used[ci + "-" + v]) {
        tiles += '<div class="tile used" aria-hidden="true"></div>';
      } else {
        tiles += '<button class="tile" data-action="pick" data-cat="' + ci + '" data-v="' + v + '" aria-label="' +
          esc(CATS[ci].name) + ' for ' + v + (v === 1 ? ' point' : ' points') + '">' + v + '</button>';
      }
    }
  }
  var done = usedCount() === CATS.length * 10;
  var finalBlock = done
    ? '<div class="cleared"><div><span class="eyebrow accent">Board cleared</span><span class="cleared-text">Time for the final question.</span></div>' +
      '<button class="btn gold" data-action="startFinal">Go to the final question</button></div>'
    : '<button class="btn ghost right" data-action="startFinal">Skip to the final question</button>';
  return '<section class="stack">' + (done ? '' : viewTurnBanner()) +
    '<div class="board-scroll"><div class="board">' + heads + tiles + '</div></div>' + finalBlock + '</section>';
}

function viewQuestion() {
  var c = CATS[state.cat];
  var pair = c.qs[state.v - 1][state.deal[state.cat][state.v - 1]];
  var th = turnHouse();
  var dots = "";
  for (var d = 1; d <= 10; d++) dots += '<span class="dot" style="background:' + (d <= state.v ? "var(--accent)" : "#3A4266") + '"></span>';
  var body;
  if (!state.revealed) {
    var stealNote = teams.active.length > 1
      ? ' Think they’re wrong? Raise your hand to steal, and give your answer before the reveal.'
      : '';
    body = '<p class="muted lead"><strong class="turn-inline" style="color:' + HOUSES[th].color + '">' + HOUSES[th].name + '</strong> answers first.' + stealNote + '</p>' +
      '<button class="btn gold big" data-action="reveal">Reveal answer</button>';
  } else {
    var order = [th].concat(teams.active.filter(function (h) { return h !== th; }));
    var houseBtns = order.map(function (i) {
      var h = HOUSES[i];
      var label = i === th ? h.name + ' +' + state.v : h.name + ' steals +' + state.v;
      return '<button class="btn house' + (i === th || (net.buzz && net.buzz.house === i) ? ' picker' : '') + '" data-action="award" data-team="' + i + '"><span class="pip" style="background:' + h.color + '"></span>' +
        label + '</button>';
    }).join("");
    body = '<div class="answer"><span class="eyebrow">Answer</span><span class="answer-text">' + esc(pair[1]) + '</span></div>' +
      '<div class="stack-sm"><span class="label">Who got it?</span><div class="row">' + houseBtns +
      '<button class="btn ghost" data-action="award" data-team="-1">No one</button></div></div>';
  }
  return '<section class="narrow"><button class="back" data-action="back">' +
    '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Back to the board</button>' +
    '<div class="card"><div class="meta"><span class="chip">' + esc(c.name) + '</span><div class="meta-right"><span class="muted small">Difficulty</span>' +
    '<span class="dots">' + dots + '</span><span class="pts">' + state.v + (state.v === 1 ? ' point' : ' points') + '</span></div></div>' +
    '<p class="question">' + esc(pair[0]) + '</p>' + viewBuzzBanner() + body + '</div></section>';
}

function viewFinal() {
  var fq = FINALS[state.finalIdx];
  var act = teams.active;
  var inner = "";
  if (state.finalStep === "wager") {
    var cards = act.map(function (i) {
      var h = HOUSES[i];
      return '<div class="wager"><span class="bar" style="background:' + h.color + '"></span>' +
        '<span class="wager-name">' + h.name + '</span><span class="muted small pad">Score ' + state.scores[i] + ' · max wager ' + maxWager(i) + '</span>' +
        '<label class="label pad" for="wager-' + i + '">Wager</label>' +
        '<input id="wager-' + i + '" data-wager="' + i + '" type="number" min="0" max="' + maxWager(i) + '" inputmode="numeric" value="' + esc(state.wagers[i]) + '"></div>';
    }).join("");
    inner = '<p class="muted lead">Each house secretly writes down a wager, from 0 up to its current score. A house with fewer than 10 points can wager up to 10. Enter the wagers, then show the question. A right answer adds the wager, and a wrong one takes it away.</p>' +
      '<div class="wagers">' + cards + '</div><button class="btn gold big" data-action="lockWagers">Lock wagers and show the question</button>';
  } else if (state.finalStep === "question") {
    inner = '<p class="question">' + esc(fq.q) + '</p><p class="muted">Each house has 30 seconds to write down its answer.</p>' +
      '<button class="btn gold big" data-action="revealFinal">Reveal answer</button>';
  } else if (state.finalStep === "judge") {
    var rows = act.map(function (i) {
      var h = HOUSES[i];
      var j = state.judged[i];
      var w = parseInt(state.wagers[i], 10) || 0;
      return '<div class="judge-row"><div class="row-left"><span class="pip" style="background:' + h.color + '"></span><strong>' + h.name + '</strong>' +
        '<span class="muted">wagered ' + w + '</span></div><div class="row">' +
        '<button class="btn judge' + (j === true ? ' right-on' : '') + '" aria-pressed="' + (j === true) + '" data-action="judge" data-house="' + i + '" data-right="1">Right +' + w + '</button>' +
        '<button class="btn judge' + (j === false ? ' wrong-on' : '') + '" aria-pressed="' + (j === false) + '" data-action="judge" data-house="' + i + '" data-right="0">Wrong −' + w + '</button></div></div>';
    }).join("");
    var all = act.every(function (i) { return state.judged[i] !== null; });
    inner = '<p class="question">' + esc(fq.q) + '</p>' +
      '<div class="answer"><span class="eyebrow">Answer</span><span class="answer-text">' + esc(fq.a) + '</span></div>' +
      '<span class="label">Mark each house right or wrong</span><div class="stack-sm">' + rows + '</div>' +
      (all ? '<button class="btn gold big" data-action="finishFinal">Crown the House Cup winner</button>'
           : '<span class="muted">Mark every house to see the winner.</span>');
  } else {
    var idx = act.slice().sort(function (a, b) { return state.scores[b] - state.scores[a]; });
    var places = ["1st", "2nd", "3rd", "4th"];
    var rank = idx.map(function (i, k) {
      var dd = state.scores[i] - state.before[i];
      var delta = dd > 0 ? "+" + dd : dd < 0 ? "−" + Math.abs(dd) : "±0";
      return '<div class="rank"><span class="place">' + places[k] + '</span><span class="pip big-pip" style="background:' + HOUSES[i].color + '"></span>' +
        '<span class="rank-name">' + HOUSES[i].name + '</span><span class="muted">final question ' + delta + '</span><span class="rank-score">' + state.scores[i] + '</span></div>';
    }).join("");
    var top = Math.max.apply(null, act.map(function (i) { return state.scores[i]; }));
    var names = act.filter(function (i) { return state.scores[i] === top; }).map(function (i) { return HOUSES[i].name; });
    var winner = names.length === 1 ? names[0] + " wins the House Cup!"
      : names.length === act.length && act.length > 2 ? "Everyone ties!"
      : "It's a tie: " + names.slice(0, -1).join(", ") + " and " + names[names.length - 1] + "!";
    inner = '<div class="winner"><span class="eyebrow">The House Cup</span><span class="winner-text">' + esc(winner) + '</span></div>' +
      '<div class="stack-sm">' + rank + '</div><button class="btn gold big center" data-action="reset">Play again</button>';
  }
  return '<section class="narrow wide"><div class="card final"><div class="meta"><span class="final-title">Final Question</span>' +
    '<span class="chip">Category: ' + esc(fq.cat) + '</span></div>' + inner + '</div></section>';
}

function render() {
  if (phoneMode) { renderPhone(); return; }
  var main = state.screen === "setup" ? viewSetup()
    : state.screen === "board" ? viewBoard()
    : state.screen === "question" ? viewQuestion()
    : viewFinal();
  var showSplash = state.screen === "final" && state.finalStep === "results" && state.splash;
  if (!showSplash && confetti.raf) stopConfetti();
  document.getElementById("app").innerHTML = viewHeader() + main + (showSplash ? viewSplash() : "");
  if (showSplash) { var sb = document.querySelector(".splash .btn"); if (sb) sb.focus(); }
  var key = state.screen + "/" + state.finalStep + "/" + state.setupStep;
  if (key !== lastView) window.scrollTo(0, 0);
  lastView = key;
  hostBroadcast();
}

// ---------- Wiring ----------
document.addEventListener("click", function (e) {
  if (phoneMode) return;
  var el = e.target.closest("[data-action]");
  if (wantMusic && !audio.on && !(el && el.dataset.action === "toggleMusic")) startMusic();
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el);
});
document.addEventListener("input", function (e) {
  var i = e.target.dataset && e.target.dataset.wager;
  if (i !== undefined) state.wagers[+i] = e.target.value; // no re-render, so typing keeps focus
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target.id === "name-input") { e.preventDefault(); addNameFromInput(); }
  if (e.key === "Escape" && state.splash) actions.closeSplash();
});

state = fresh();
state.screen = "setup";
if (phoneMode) startPhone(); else render();
</script>
</body>
</html>
